<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PowerKlock · reel</title>
<!--
  The morning reel: a vertical 9:16 animation of the day's main figures, recorded to MP4 every morning at 08:00 Paris
  (scripts/record_reel.py, .github/workflows/reel.yml) and sent by e-mail to be posted on Instagram.
  Reels (?r=): jour (default), batterie, europe, mix. Jour scenes: today's French day-ahead price against yesterday, the day's profile, Cal+1, Monday only the GO and last
  week's spot, an important event of the day (data/events.json), the market brief (data/market_digest.json).
  French by default, English with #en. No link to the rest of the site (like shared dashboards).
  window.REEL_DONE is set when the last scene ends (the recorder waits for it).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F14;--panel:#121821;--line:#243042;--fg:#E6EDF3;--muted:#8DA2B8;--up:#ED6965;--down:#4ADE80;--blue:#7FC8F8;--accent:#7FC8F8;--amber:#FBBF24;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:var(--sans)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
/* 9:16 stage, sized to the screen; everything inside is in --u (1/100 of the stage width) */
#stage{position:relative;width:min(100vw,56.25vh);height:min(177.78vw,100vh);background:radial-gradient(120% 70% at 50% 0%,#16202D 0%,var(--bg) 60%);overflow:hidden;--u:calc(min(100vw,56.25vh)/100)}
/* a slow-drifting glow behind every scene, so nothing ever sits as a fully still frame */
#stage::before{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(38% 30% at 28% 18%,rgba(127,200,248,.16),transparent 62%),radial-gradient(42% 32% at 78% 86%,rgba(251,191,36,.10),transparent 62%);
  animation:drift 22s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3%,-2%) scale(1.06)}66%{transform:translate(-2%,3%) scale(1.04)}}
/* scenes slide in from the right and out to the left, like stories */
.scene{position:absolute;inset:0;padding:calc(14*var(--u)) calc(8*var(--u)) calc(22*var(--u));display:flex;flex-direction:column;justify-content:center;gap:calc(3*var(--u));opacity:0;transform:translateX(calc(12*var(--u)));transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.scene.on{opacity:1;transform:none}
.scene.out{opacity:0;transform:translateX(calc(-12*var(--u)))}
.scene > *{opacity:0;transform:translateY(calc(5*var(--u)))}
.scene.on > *{animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.scene.on > *:nth-child(2){animation-delay:.15s}.scene.on > *:nth-child(3){animation-delay:.3s}.scene.on > *:nth-child(4){animation-delay:.6s}.scene.on > *:nth-child(5){animation-delay:.8s}.scene.on > *:nth-child(6){animation-delay:1s}
@keyframes rise{to{opacity:1;transform:none}}
/* headlines build word by word (each word carries its own --d delay) */
.scene.on > .h{animation:none;opacity:1;transform:none}
.w{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(6px)}
.scene.on .w{animation:wordin .75s cubic-bezier(.2,.8,.2,1) var(--d,0ms) forwards}
@keyframes wordin{to{opacity:1;transform:none;filter:none}}
.scene.on .delta{animation:rise .6s ease .6s forwards,pop .5s ease 1.2s}
.scene.on .delta.late{animation:rise .45s cubic-bezier(.3,1.5,.5,1) var(--late) forwards,pop .5s ease calc(var(--late) + .45s)}
@keyframes pop{50%{transform:scale(1.1)}}
/* a figure that has just finished counting lands with a small punch */
.big{display:inline-block}
.big.punch{animation:punch .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes punch{40%{transform:scale(1.12)}100%{transform:none}}
/* brief: items come in one at a time (JS adds .in), the earlier ones step back (.dim) so the eye follows the new one */
.brief div{opacity:0;transform:translateX(calc(-8*var(--u)));transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.brief div.in{opacity:1;transform:none}
.brief div.in.dim{opacity:.42}
.wb{opacity:0}
.brief div.in .wb{animation:wordin .4s ease var(--d) forwards}
.tile{opacity:0;transform:scale(.92)}.scene.on .tile{animation:tile .5s cubic-bezier(.3,1.4,.5,1) forwards}.scene.on .row .tile:nth-child(2){animation-delay:.25s}.scene.on .tile{animation-delay:1.6s}.scene.on .row .tile:nth-child(2){animation-delay:1.85s}
@keyframes tile{to{opacity:1;transform:none}}
/* price gauge: a marker slides from yesterday's price to today's, the stretch between them fills red (up) or green (down) */
.gauge2{position:relative;padding-top:calc(1*var(--u))}
.g-track{position:relative;height:calc(2.4*var(--u));background:var(--line);border-radius:99px}
.g-fill{position:absolute;top:0;bottom:0;border-radius:99px;transform:scaleX(0)}
.gauge2.up .g-fill{background:var(--up);transform-origin:left}.gauge2.down .g-fill{background:var(--down);transform-origin:right}.gauge2.flat .g-fill{background:var(--muted)}
.scene.on .g-fill{animation:gfill var(--ms) cubic-bezier(.3,.7,.2,1) var(--dl) forwards}
@keyframes gfill{to{transform:scaleX(1)}}
.g-y{position:absolute;top:calc(-1.4*var(--u));width:calc(.7*var(--u));height:calc(5.2*var(--u));margin-left:calc(-.35*var(--u));background:var(--muted);border-radius:2px}
.g-t{position:absolute;top:50%;width:calc(5*var(--u));height:calc(5*var(--u));margin:calc(-2.5*var(--u)) 0 0 calc(-2.5*var(--u));border-radius:50%;background:var(--fg);box-shadow:0 0 0 calc(1*var(--u)) rgba(230,237,243,.18),0 0 calc(4*var(--u)) rgba(230,237,243,.45);left:var(--p0)}
.scene.on .g-t{animation:gt var(--ms) cubic-bezier(.3,.7,.2,1) var(--dl) forwards}
@keyframes gt{from{left:var(--p0)}to{left:var(--p1)}}
.g-lab{position:relative;height:calc(6*var(--u));font:600 calc(3.2*var(--u)) var(--mono);color:var(--muted)}
.g-lab span{position:absolute;top:calc(1.6*var(--u));transform:translateX(-50%);white-space:nowrap}
/* day profile: the lowest and highest quarter-hours pop when the sweep reaches them */
.mk{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .25s ease,transform .45s cubic-bezier(.3,1.7,.5,1)}
.mk.hit{opacity:1;transform:none}
.mk .ring{fill:none;stroke-width:5;opacity:0}
.mk.hit .ring{animation:ring 1s ease-out}
@keyframes ring{0%{r:16;opacity:.9}100%{r:70;opacity:0}}
.spread line,.spread path{stroke-dasharray:1;stroke-dashoffset:1}
.spread.go line,.spread.go path{transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.2,1);stroke-dashoffset:0}
.spread text{opacity:0;transition:opacity .4s ease .5s}.spread.go text{opacity:1}
/* forward chart: the line draws itself, the end dot appears when it arrives */
.draw2{stroke-dasharray:1;stroke-dashoffset:1}
.scene.on .draw2{animation:draw2 var(--ms,1.8s) cubic-bezier(.4,.1,.2,1) var(--dl,.4s) forwards}
@keyframes draw2{to{stroke-dashoffset:0}}
.endpt{opacity:0}.scene.on .endpt{animation:rise .3s ease var(--dl2) forwards,endpulse 1.6s ease-in-out calc(var(--dl2) + .3s) infinite}
@keyframes endpulse{50%{r:18}}
.kick{font:700 calc(3.6*var(--u)) var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.h{font:800 calc(8.4*var(--u))/1.08 var(--sans);letter-spacing:-.01em;text-wrap:balance;hyphens:none}
.nw{white-space:nowrap}
.big{font:800 calc(22*var(--u))/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.unit{font:500 calc(4.4*var(--u)) var(--mono);color:var(--muted)}
.delta{font:800 calc(7.5*var(--u)) var(--mono);display:flex;flex-wrap:wrap;align-items:baseline;gap:calc(1*var(--u)) calc(2*var(--u))}
.delta .unit{white-space:nowrap}
.figline{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 calc(2*var(--u))}
.figline .unit{white-space:nowrap}
#p-head{filter:drop-shadow(0 0 10px rgba(127,200,248,.85))}
#p-head,#p-cur{transition:opacity .4s ease}
.big.long{font-size:calc(17*var(--u))}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.sub{font:400 calc(4.2*var(--u))/1.4 var(--sans);color:var(--muted)}
.row{display:flex;gap:calc(3*var(--u))}
.tile{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:calc(2.5*var(--u));padding:calc(3.5*var(--u))}
.tile .l{white-space:nowrap;font:700 calc(3*var(--u)) var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:800 calc(8.5*var(--u)) var(--mono);margin-top:calc(1*var(--u))}
.tile .s{font:500 calc(3.3*var(--u)) var(--mono);color:var(--muted)}
svg{width:100%;height:auto;overflow:visible}
.brief{display:flex;flex-direction:column;gap:calc(3*var(--u))}
.brief div{background:var(--panel);border-left:calc(1*var(--u)) solid var(--amber);border-radius:calc(1.5*var(--u));padding:calc(3*var(--u)) calc(3.5*var(--u));font:400 calc(4*var(--u))/1.4 var(--sans)}
.brief b{display:block;font:700 calc(3.2*var(--u)) var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:calc(1*var(--u))}
.brief .up b{color:var(--up)}.brief .down b{color:var(--down)}
.brief .up{border-left-color:var(--up)}.brief .down{border-left-color:var(--down)}
.event{background:var(--panel);border:1px solid var(--line);border-radius:calc(2.5*var(--u));padding:calc(5*var(--u))}
.brand{position:absolute;bottom:calc(7*var(--u));left:calc(8*var(--u));display:flex;align-items:center;gap:calc(2*var(--u));z-index:2}   /* small, bottom left, as on Instagram */
.brand .logo{width:calc(7*var(--u));height:auto;display:block}
.brand .d{font:500 calc(2.8*var(--u)) var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bar{position:absolute;top:calc(5*var(--u));left:calc(8*var(--u));right:calc(8*var(--u));display:flex;gap:calc(1.2*var(--u));z-index:2}
.bar i{flex:1;height:calc(.7*var(--u));background:var(--line);border-radius:9px;overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:var(--fg)}
.bar i.done b{width:100%}
.bar i.run b{animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 2.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gauge{display:flex;align-items:center;gap:calc(3*var(--u))}
.batt{position:relative;flex:1;height:calc(9*var(--u));border:calc(.6*var(--u)) solid var(--fg);border-radius:calc(1.6*var(--u));padding:calc(.8*var(--u))}
.batt:after{content:"";position:absolute;right:calc(-2.2*var(--u));top:28%;width:calc(1.4*var(--u));height:44%;background:var(--fg);border-radius:0 4px 4px 0}
.batt.demo b{width:8%}.scene.on .batt.demo b{animation:demo 2.6s cubic-bezier(.4,0,.2,1) .5s forwards}
@keyframes demo{0%{width:8%;background:#7FC8F8}55%{width:96%;background:#7FC8F8}60%{width:96%;background:#FBBF24}100%{width:12%;background:#FBBF24}}
.batt b{display:block;height:100%;width:50%;background:var(--accent);border-radius:calc(.8*var(--u));transition:width .08s linear,background .2s}
.clock{font:800 calc(7*var(--u)) var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.act{font:700 calc(3.6*var(--u)) var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.money.punch{animation:punch .5s cubic-bezier(.3,1.6,.5,1)}
.money{display:inline-block;font:800 calc(12*var(--u)) var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.race{display:flex;flex-direction:column;gap:calc(1.6*var(--u))}
.race .r{display:grid;grid-template-columns:calc(24*var(--u)) 1fr;align-items:center;gap:calc(2*var(--u))}
.race .n{font:600 calc(3.6*var(--u)) var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race .t{height:calc(5.2*var(--u));display:flex;align-items:center}
.race .t i{display:block;height:100%;width:0;border-radius:calc(.8*var(--u));background:#3A4A5E;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.race .t span{font:700 calc(3.4*var(--u)) var(--mono);margin-left:calc(1.6*var(--u));white-space:nowrap;opacity:0;transition:opacity .4s ease .9s}
.race .r.fr .n{color:var(--accent);font-weight:800}.race .r.fr .t i{background:var(--accent)}
.race.go .t span{opacity:1}
.race .r.fr.win .t i{animation:frwin .5s ease 3}.race .r.fr.win .n{animation:frwin .5s ease 3}
@keyframes frwin{50%{filter:brightness(1.6);transform:scale(1.06)}}
.lg{display:flex;flex-wrap:wrap;gap:calc(1.5*var(--u)) calc(3.5*var(--u));font:600 calc(3.2*var(--u)) var(--mono);color:var(--muted)}
.lg i{display:inline-block;width:calc(2.6*var(--u));height:calc(2.6*var(--u));border-radius:2px;margin-right:calc(1.2*var(--u));vertical-align:-2px}
@media (prefers-reduced-motion: reduce){.scene{transition:none}.draw,.draw2{animation:none;stroke-dashoffset:0}.scene > *,.tile,.brief div,.w,.wb,.endpt,.mk{opacity:1;transform:none;filter:none;animation:none!important}
  #stage::before{animation:none!important}.g-fill{transform:none;animation:none!important}.g-t{left:var(--p1);animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="bar" id="bar"></div>
  <div id="scenes"></div>
  <div class="brand"><img class="logo" src="assets/logo-icon-yellow.png" alt="PowerKlock" translate="no"><div class="d" id="brand-d"></div></div>
</div>
<script>
(function () {
  'use strict';
  const EN = location.hash === '#en';
  const T = (f, e) => EN ? e : f;
  const SCENE_MS = 3600;
  const fmt = (v, d) => v == null || !isFinite(v) ? '–' : v.toLocaleString(EN ? 'en-GB' : 'fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const sgn = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '±') + fmt(Math.abs(v), d);
  const paris = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris' });
  const q = new URLSearchParams(location.search);
  const today = q.get('d') || paris.format(new Date());                       // ?d=YYYY-MM-DD replays a day
  const addDays = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
  const longDate = d => new Date(d + 'T12:00:00Z').toLocaleDateString(EN ? 'en-GB' : 'fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  const get = p => fetch(p, { cache: 'no-store' }).then(r => r.ok ? (p.endsWith('.csv') ? r.text() : r.json()) : null).catch(() => null);
  const dir = v => v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'flat';
  const arrow = v => v > 0.05 ? '▲' : v < -0.05 ? '▼' : '■';
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  // a phrase split into words that come in one after the other; a figure stays glued to its unit
  const words = (s, base = 0, step = 90, cls = 'w') => String(s).replace(/(\d)\s+(?=[€%$°]|GW|MW|TWh|pts)/g, '$1 ')
    .split(/ +/).map((w, i) => `<span class="${cls}" style="--d:${base + Math.round(i * step * 1.6)}ms">${w}</span>`).join(' ');

  // scene 1: the price counts from yesterday's to today's while a marker slides between the two on a gauge
  function priceScene(D0, D1) {
    const a = D0.avg, b = D1 && D1.avg, dv = b == null ? null : a - b, d = dir(dv || 0);
    const DL = 1000, MS = 1600;
    // the gauge is zoomed on yesterday's price (in the middle), so even a 1 % move travels a visible distance
    const R = b == null ? 1 : Math.max(Math.abs(dv) * 1.6, Math.abs(b) * 0.02, 1.5), pos = v => Math.max(4, Math.min(96, 50 + (v - b) / R * 50));
    const pa = b == null ? null : pos(a), pb = b == null ? null : 50;
    return { ms: 5600, html: `<div class="kick">${T('Spot France · aujourd’hui', 'France spot · today')}</div>
      <div class="h">${words(T('Le prix de l’électricité', 'The power price'), 150, 110)}</div>
      <div class="figline"><span class="big${fmt(a, 1).length > 5 ? ' long' : ''}" data-count="${a}" data-from="${b == null ? 0 : b}" data-dec="1" data-delay="${b == null ? 300 : DL}" data-ms="${b == null ? 1100 : MS}" data-punch="1">${fmt(b == null ? a : b, 1)}</span> <span class="unit">€/MWh</span></div>
      ${pb == null ? '' : `<div class="gauge2 ${d}" style="--dl:${DL}ms;--ms:${MS}ms"><div class="g-track"><i class="g-fill" style="left:${Math.min(pa, pb)}%;width:${Math.abs(pa - pb)}%"></i><span class="g-y" style="left:${pb}%"></span><span class="g-t" style="--p0:${pb}%;--p1:${pa}%"></span></div>
        <div class="g-lab"><span style="left:${Math.max(12, Math.min(88, pb))}%">${T('hier', 'yesterday')} ${fmt(b, 0)}&nbsp;€</span></div></div>`}
      ${dv == null ? '' : `<div class="delta late ${d}" style="--late:${DL + MS - 100}ms"><span class="nw">${arrow(dv)} ${sgn(dv, 1)}&nbsp;€</span> <span class="unit">${T('vs hier', 'vs yesterday')} (${sgn(dv / b * 100, 0)}&nbsp;%)</span></div>`}
      <div class="sub" style="animation-delay:${DL + MS + 500}ms">${T('Moyenne du jour de livraison, enchère day-ahead d’hier midi.', 'Delivery-day average, yesterday’s noon day-ahead auction.')}</div>` };
  }
  function profileScene(D0) {
    // the full 96 quarter-hours, not a 24-point hourly mean: battery/solar swings are quarter-hour events,
    // averaging them into hours would understate the real peak-low spread
    const H = D0.hourly, N = H.length;
    const mn = Math.min(...H), mx = Math.max(...H), lo = Math.min(0, mn), W = 1000, Ht = 520;
    const x = i => i / (N - 1) * W, y = v => Ht - (v - lo) / (mx - lo || 1) * Ht;
    const pts = H.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const iMin = H.indexOf(mn), iMax = H.indexOf(mx), neg = D0.negH || 0;
    const hhmm = i => String(Math.floor(i / 4)).padStart(2, '0') + ':' + String(i % 4 * 15).padStart(2, '0');
    const SWEEP = 4000, TILES = SWEEP + 1100;
    // the label of a marker sits above or below its dot, kept inside the chart's width
    const lx = i => Math.max(70, Math.min(W - 70, x(i)));
    const mark = (cls, i, v, col, above) => `<g class="mk ${cls}"><circle class="ring" cx="${x(i)}" cy="${y(v)}" r="16" stroke="${col}"/>
      <circle cx="${x(i)}" cy="${y(v)}" r="16" fill="${col}"/><text x="${lx(i)}" y="${above ? y(v) - 34 : y(v) + 64}" text-anchor="middle" fill="${col}" font-family="JetBrains Mono" font-size="44" font-weight="800">${fmt(v, 0)} €</text></g>`;
    // after the sweep: the gap between the lowest and highest quarter-hour drawn as a bracket on the right
    const bx = W + 6, yMn = y(mn), yMx = y(mx);
    return { ms: SWEEP + 3000, html: `<div class="kick">${T('La journée quart d’heure par quart d’heure', 'The day, quarter-hour by quarter-hour')}</div>
      <div class="row" style="align-items:baseline;justify-content:space-between"><div class="clock" id="p-clock">00:00</div><div class="act" id="p-act" style="color:var(--muted)">–</div></div>
      <svg viewBox="-20 -60 1040 660" aria-hidden="true">
        ${lo < 0 ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#ED6965" stroke-dasharray="8 8"/>` : ''}
        <defs><clipPath id="p-clip"><rect id="p-cr" x="-20" y="-60" width="0" height="660"/></clipPath></defs>
        <g clip-path="url(#p-clip)"><polygon points="0,${Ht} ${pts} ${W},${Ht}" fill="rgba(127,200,248,.16)"/>
          <polyline points="${pts}" fill="none" stroke="#7FC8F8" stroke-width="7" stroke-linejoin="round"/></g>
        <line id="p-cur" x1="0" x2="0" y1="-60" y2="${Ht + 100}" stroke="#8DA2B8" stroke-width="3" stroke-dasharray="6 6"/>
        <g class="spread" id="p-spread">
          <line pathLength="1" x1="${x(iMin)}" x2="${bx}" y1="${yMn}" y2="${yMn}" stroke="#FBBF24" stroke-width="3" stroke-dasharray="1"/>
          <line pathLength="1" x1="${x(iMax)}" x2="${bx}" y1="${yMx}" y2="${yMx}" stroke="#FBBF24" stroke-width="3" stroke-dasharray="1"/>
          <path pathLength="1" d="M${bx},${yMn} L${bx},${yMx} M${bx - 14},${yMx + 20} L${bx},${yMx} L${bx + 14},${yMx + 20} M${bx - 14},${yMn - 20} L${bx},${yMn} L${bx + 14},${yMn - 20}" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        ${mark('mk-min', iMin, mn, '#4ADE80', false)}${mark('mk-max', iMax, mx, '#ED6965', true)}
        <circle id="p-head" cx="0" cy="${y(H[0])}" r="10" fill="#fff"/>
        ${[0, 24, 48, 72, 95].map(i => `<text x="${x(i)}" y="${Ht + 60}" text-anchor="middle" fill="#8DA2B8" font-family="JetBrains Mono" font-size="34">${Math.floor(i / 4)}&#160;h</text>`).join('')}
      </svg>
      <div class="row"><div class="tile" style="animation-delay:${TILES}ms;border-color:rgba(251,191,36,.55)"><div class="l">${T('Pic − creux', 'Peak − low')}</div><div class="v nw" style="color:var(--amber)">${fmt(mx - mn, 0)}&nbsp;€</div><div class="s">${T('ce que voit une batterie', 'what a battery sees')}</div></div>
        <div class="tile" style="animation-delay:${TILES + 250}ms"><div class="l">${T('Heures ≤ 0 €', 'Hours ≤ 0 €')}</div><div class="v">${fmt(neg, neg % 1 ? 1 : 0)}</div><div class="s">${T('prix nuls ou négatifs', 'zero or negative')}</div></div></div>`,
      play(root) {
        const clock = root.querySelector('#p-clock'), act = root.querySelector('#p-act'),
          cr = root.querySelector('#p-cr'), cur = root.querySelector('#p-cur'), head = root.querySelector('#p-head'),
          mkMin = root.querySelector('.mk-min'), mkMax = root.querySelector('.mk-max'), spread = root.querySelector('#p-spread');
        [mkMin, mkMax, spread].forEach(e => e.classList.remove('hit', 'go'));
        let lastI = -1;
        // t is a continuous position (0…N-1): the line and the head dot glide on every frame, the clock and
        // price only tick once per quarter-hour — the sweep stays fluid even though the data is stepped
        const paint = t => {
          t = Math.max(0, Math.min(N - 1, t));   // a stray rAF tick with a now before t0 must never go negative
          const i = Math.floor(t), i1 = Math.min(N - 1, i + 1), fr = t - i, xx = x(t), yy = y(H[i] + (H[i1] - H[i]) * fr);
          cr.setAttribute('width', 20 + t / (N - 1) * (W + 40)); cur.setAttribute('x1', xx); cur.setAttribute('x2', xx);

          if (t >= iMax) mkMax.classList.add('hit');

        };
        if (reduced()) { paint(N - 1); spread.classList.add('go'); return; }
        const t0 = performance.now();
        const step = now => {
          const f = Math.min(1, (now - t0) / SWEEP);
          paint(f * (N - 1));
          if (f < 1) requestAnimationFrame(step);
          else setTimeout(() => { head.style.opacity = 0; cur.style.opacity = 0; spread.classList.add('go'); }, 250);
        };

      } };

  // scene 3: two months of the next calendar year draw themselves, then the last session's move lands
  function calScene(cal) {

    const pts = s.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const d = dir(cal.dv), col = d === 'up' ? '#ED6965' : d === 'down' ? '#4ADE80' : '#8DA2B8';
    const land = DL + DRAW;
    return { ms: 5800, html: `<div class="kick">${T('Marché à terme', 'Forward market')}</div>
      <div class="h">${words(T('Électricité livrée en ' + cal.y, 'Power delivered in ' + cal.y), 150, 110)}</div>

      </svg>

      <div class="sub" style="animation-delay:${land + 600}ms">${T('Contrat Cal', 'Cal')} ${cal.y} ${T('base France, cotation du', 'France baseload, settlement of')} ${new Date(cal.d + 'T12:00:00Z').toLocaleDateString(EN ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'long', timeZone: 'UTC' })}.</div>` };
  }

  // last scene: the brief's points come one at a time, read word by word; the earlier ones step back
  // the first sentence of a point is its gist; three full paragraphs would not fit a 9:16 frame
  const first = s => { const t = String(s || ''), m = t.match(/^.+?[.!?](?=\s+[A-ZÀ-Ý«]|$)/); return m ? m[0] : t; };

    if (c && c.values && c.values.length > 1) {

      S.push(calScene({ y: y1, v: c.values[n - 1], dv: c.values[n - 1] - c.values[n - 2], d: c.dates[n - 1], d0: c.dates[k0], series: c.values.slice(k0) }));
    }

    if (new Date(today + 'T12:00:00Z').getUTCDay() === 1) {
      const days = n => Promise.all(Array.from({ length: 7 }, (_, i) => get('data/history/daily/' + addDays(today, -n - i) + '.json')));
      const [w1, w2] = await Promise.all([days(1), days(8)]);
      const m = w => { const v = w.map(f => f && f.zones && f.zones.FR && f.zones.FR.avg).filter(v => v != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
      const a = m(w1), b = m(w2);

    const e = ev && (ev.items || []).find(x => (x.date === today || x.date === addDays(today, -1)) && (x.importance || 0) >= 2);
    if (e) S.push(eventScene(e));

    run(S);
  }

  // ── reel 2: a battery through the day (data/history/bess_da.json, the optimal schedule of the day) ──

  // ── reel 4: yesterday's production hour by hour under the price (data/history/daily/<yesterday>.json) ──
  async function mix() {
    const dy = addDays(today, -1), f = await get('data/history/daily/' + dy + '.json'), F = f && f.zones && f.zones.FR;
    const ok = k => F && Array.isArray(F[k]) && F[k].length === 96;
    if (!ok('hourly') || !ok('nuclear') || !ok('solar')) return run([`<div class="h">${T('Production d’hier pas encore complète.', 'Yesterday’s output not complete yet.')}</div>`]);
    const hr = a => Array.from({ length: 24 }, (_, i) => a.slice(i * 4, i * 4 + 4).reduce((s, v) => s + (v || 0), 0) / 4 / 1000);   // GW per hour
    const SER = [['nuclear', T('Nucléaire', 'Nuclear'), '#E6C86E'], ['hydro', T('Hydraulique', 'Hydro'), '#5B8DEF'], ['wind', T('Éolien', 'Wind'), '#7FC8F8'],
      ['solar', T('Solaire', 'Solar'), '#FBBF24'], ['fossil', T('Gaz et fossiles', 'Gas and fossil'), '#8D99AE']].filter(([k]) => ok(k)).map(([k, n, c]) => ({ k, n, c, v: hr(F[k]) }));
    const price = hr(F.hourly).map(v => v * 1000);
    const tot = Array.from({ length: 24 }, (_, i) => SER.reduce((s, x) => s + x.v[i], 0)), top = Math.max(...tot) * 1.08;
    const W = 1000, H = 560, x = i => i / 23 * W, y = v => H - v / top * H;
    const pl = Math.min(0, ...price), ph = Math.max(...price), yp = v => H - (v - pl) / (ph - pl || 1) * H * .9;
    let base = Array(24).fill(0);
    const areas = SER.map(sr => {
      const up = base.map((b, i) => b + sr.v[i]);
      const pts = up.map((v, i) => x(i) + ',' + y(v)).join(' ') + ' ' + base.map((v, i) => x(i) + ',' + y(v)).reverse().join(' ');
      base = up; return `<polygon points="${pts}" fill="${sr.c}" opacity=".85"/>`;
    }).join('');
    const pline = price.map((v, i) => x(i) + ',' + yp(v)).join(' ');
    const sol = SER.find(s => s.k === 'solar'), hSol = sol.v.indexOf(Math.max(...sol.v)), hMin = price.indexOf(Math.min(...price)), hMax = price.indexOf(Math.max(...price));
    const SWEEP = 8000;
    const sweep = { ms: SWEEP + 1500, html: `<div class="kick">${T('Hier en France · heure par heure', 'Yesterday in France · hour by hour')}</div>
      <div class="row" style="align-items:baseline;justify-content:space-between"><div class="clock" id="m-clock">0 h</div><div class="act" id="m-p">–</div></div>
      <svg viewBox="-10 -30 1020 660" aria-hidden="true"><defs><clipPath id="m-clip"><rect id="m-cr" x="-10" y="-30" width="0" height="700"/></clipPath></defs>
        <g clip-path="url(#m-clip)">${areas}<polyline points="${pline}" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></g>
        ${[0, 6, 12, 18, 23].map(i => `<text x="${x(i)}" y="${H + 50}" text-anchor="middle" fill="#8DA2B8" font-family="JetBrains Mono" font-size="32">${i}&#160;h</text>`).join('')}</svg>
      <div class="lg">${SER.map(s => `<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}<span><i style="background:#fff;height:3px;vertical-align:4px"></i>${T('prix', 'price')}</span></div>`,
      play(root) {
        const t0 = performance.now(), cr = root.querySelector('#m-cr'), ck = root.querySelector('#m-clock'), pe = root.querySelector('#m-p');
        const step = now => {
          const f = Math.min(1, (now - t0) / SWEEP), i = Math.min(23, Math.floor(f * 24));
          cr.setAttribute('width', 10 + f * (W + 10)); ck.textContent = i + ' h';
          pe.textContent = fmt(price[i], 0) + ' €/MWh · ' + T('solaire ', 'solar ') + fmt(sol.v[i], 1) + ' GW';
          pe.style.color = price[i] <= price[hMin] + 5 ? 'var(--down)' : price[i] >= price[hMax] - 5 ? 'var(--up)' : 'var(--muted)';
          if (f < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      } };
    const solarDay = Math.abs(hSol - hMin) <= 2 && sol.v[hSol] > 3;
    const head = solarDay ? T('Le solaire creuse le prix à midi', 'Solar digs the midday price') : T('Le prix suit la demande du soir', 'The price follows the evening demand');
    const take = { ms: 5000, html: `<div class="kick">${T('Ce qu’on a vu', 'What we saw')}</div>
      <div class="h">${words(head, 150, 100)}</div>
      <div class="row"><div class="tile"><div class="l">${T('Prix le plus bas', 'Lowest price')}</div><div class="v nw"><span class="big-sm" data-count="${price[hMin]}" data-dec="0" data-delay="1700" data-ms="900">${fmt(price[hMin], 0)}</span>&nbsp;€</div><div class="s"><span class="nw">${T('à ', 'at ')}${hMin}&nbsp;h</span><br><span class="nw">${T('solaire', 'solar')} ${fmt(sol.v[hMin], 1)}&nbsp;GW</span></div></div>
        <div class="tile"><div class="l">${T('Prix le plus haut', 'Highest price')}</div><div class="v nw"><span class="big-sm" data-count="${price[hMax]}" data-dec="0" data-delay="1950" data-ms="900">${fmt(price[hMax], 0)}</span>&nbsp;€</div><div class="s"><span class="nw">${T('à ', 'at ')}${hMax}&nbsp;h</span><br><span class="nw">${T('solaire', 'solar')} ${fmt(sol.v[hMax], 1)}&nbsp;GW</span></div></div></div>
      <div class="sub" style="animation-delay:2.7s">${T('Production réelle par filière (ENTSO-E) et prix day-ahead, moyennes horaires.', 'Actual output by source (ENTSO-E) and day-ahead price, hourly means.')}</div>` };
    document.getElementById('brand-d').textContent = longDate(dy);
    run([sweep, take], true);
  }

  // plays the scenes: strings or {html, ms, play(root)}; window.REEL_DONE once the last one has run its time
  function run(S, keepDate) {
    S = S.map(x => typeof x === 'string' ? { html: x, ms: SCENE_MS } : Object.assign({ ms: SCENE_MS }, x));
    S.forEach(x => { x.ms = Math.round(x.ms * 1.35); });   // each scene holds a third longer once its animation ends: time to read
    if (!keepDate) document.getElementById('brand-d').textContent = longDate(today);
    document.getElementById('scenes').innerHTML = S.map(x => '<section class="scene">' + x.html + '</section>').join('');
    document.getElementById('bar').innerHTML = S.map(() => '<i><b></b></i>').join('');
    const sc = [...document.querySelectorAll('.scene')], bars = [...document.querySelectorAll('#bar i')];
    let k = 0, prev = -1;
    const show = () => {
      sc.forEach((s, i) => { s.classList.toggle('on', i === k); s.classList.toggle('out', i === prev && i !== k); });
      bars.forEach((b, i) => { b.className = i < k ? 'done' : i === k ? 'run' : ''; if (i === k) b.firstChild.style.animationDuration = S[k].ms + 'ms'; });
      // replay the curve drawing each time its scene comes back
      sc[k].querySelectorAll('.draw').forEach(p => { p.classList.remove('draw'); void p.getBoundingClientRect(); p.classList.add('draw'); });
      // the big figures count from where they were (yesterday, the previous session; 0 by default) to their value,
      // after their own delay, then land with a small punch
      sc[k].querySelectorAll('[data-count]').forEach(el => {
        const to = +el.dataset.count, from = +(el.dataset.from || 0), dec = +el.dataset.dec, dur = +(el.dataset.ms || 1100), start = performance.now() + +(el.dataset.delay || 0);
        el.classList.remove('punch');
        if (reduced()) { el.textContent = fmt(to, dec); return; }
        el.textContent = fmt(from, dec);
        const step = now => { const x = Math.max(0, Math.min(1, (now - start) / dur)), e = 1 - Math.pow(1 - x, 3); el.textContent = fmt(from + (to - from) * e, dec);
          if (x < 1) requestAnimationFrame(step); else if (el.dataset.punch) { void el.offsetWidth; el.classList.add('punch'); } };
        requestAnimationFrame(step);
      });
      if (S[k].play) S[k].play(sc[k]);
      setTimeout(next, S[k].ms);
    };
    const next = () => {
      prev = k;
      k += 1;
      if (k >= S.length) { window.REEL_DONE = true; if (q.has('once')) return; k = 0; }
      show();
    };
    window.REEL_SCENES = S.length;
    window.REEL_MS = S.reduce((a, x) => a + x.ms, 0);
    show();
  }

  const R = { jour: main, batterie: battery, europe, mix };
  (R[q.get('r')] || main)();
})();
</script>
