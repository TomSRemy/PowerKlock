<!doctype html>
<html lang="fr">
<head>

<title>PowerKlock · reel</title>
<!--
  The morning reel: a vertical 9:16 animation of the day's main figures, recorded to MP4 every morning at 08:00 Paris
  (scripts/record_reel.py, .github/workflows/reel.yml) and sent by e-mail to be posted on Instagram.
  Reels (?r=): jour (default), batterie, europe, mix. Jour scenes: today's French day-ahead price against yesterday, the day's profile, Cal+1, Monday only the GO and last
  week's spot, an important event of the day (data/events.json), the market brief (data/market_digest.json).
  French by default, English with #en. No link to the rest of the site (like shared dashboards).
  window.REEL_DONE is set when the last scene ends (the recorder waits for it).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F14;--panel:#121821;--line:#243042;--fg:#E6EDF3;--muted:#8DA2B8;--up:#ED6965;--down:#4ADE80;--blue:#7FC8F8;--accent:#7FC8F8;--amber:#FBBF24;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:var(--sans)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
/* 9:16 stage, sized to the screen; everything inside is in --u (1/100 of the stage width) */
#stage{position:relative;width:min(100vw,56.25vh);height:min(177.78vw,100vh);background:radial-gradient(120% 70% at 50% 0%,#16202D 0%,var(--bg) 60%);overflow:hidden;--u:calc(min(100vw,56.25vh)/100);--U:calc(min(100vw,56.25vh)/100)}   /* --U never shrinks: the margins of a scene stay put when a full scene scales its content down */
/* a slow-drifting glow behind every scene, so nothing ever sits as a fully still frame */
#stage::before{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(38% 30% at 28% 18%,rgba(127,200,248,.16),transparent 62%),radial-gradient(42% 32% at 78% 86%,rgba(251,191,36,.10),transparent 62%);
  animation:drift 22s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3%,-2%) scale(1.06)}66%{transform:translate(-2%,3%) scale(1.04)}}
/* scenes slide in from the right and out to the left, like stories */
.scene{position:absolute;inset:0;padding:calc(18*var(--U)) calc(9*var(--U)) calc(31*var(--U)) calc(8*var(--U));display:flex;flex-direction:column;justify-content:center;gap:calc(3.4*var(--u));opacity:0;transform:translateX(calc(12*var(--u)));transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.scene.on{opacity:1;transform:none}
.scene.out{opacity:0;transform:translateX(calc(-12*var(--u)))}
.scene > *{opacity:0;transform:translateY(calc(5*var(--u)))}
.scene.on > *{animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.scene.on > *:nth-child(2){animation-delay:.15s}.scene.on > *:nth-child(3){animation-delay:.3s}.scene.on > *:nth-child(4){animation-delay:.6s}.scene.on > *:nth-child(5){animation-delay:.8s}.scene.on > *:nth-child(6){animation-delay:1s}
@keyframes rise{to{opacity:1;transform:none}}
/* headlines build word by word (each word carries its own --d delay) */
.scene.on > .h{animation:none;opacity:1;transform:none}
.w{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(6px)}
.scene.on .w{animation:wordin .75s cubic-bezier(.2,.8,.2,1) var(--d,0ms) forwards}
@keyframes wordin{to{opacity:1;transform:none;filter:none}}
.scene.on .delta{animation:rise .6s ease .6s forwards,pop .5s ease 1.2s}
.scene.on .delta.late{animation:rise .45s cubic-bezier(.3,1.5,.5,1) var(--late) forwards,pop .5s ease calc(var(--late) + .45s)}
@keyframes pop{50%{transform:scale(1.1)}}
/* a figure that has just finished counting lands with a small punch */
.big{display:inline-block}
.big.punch{animation:punch .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes punch{40%{transform:scale(1.12)}100%{transform:none}}
/* brief: items come in one at a time (JS adds .in), the earlier ones step back (.dim) so the eye follows the new one */
.brief div{opacity:0;transform:translateX(calc(-8*var(--u)));transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.brief div.in{opacity:1;transform:none}
.brief div.in.dim{opacity:.42}
.wb{opacity:0}
.brief div.in .wb{animation:wordin .4s ease var(--d) forwards}
.tile{opacity:0;transform:scale(.92)}.scene.on .tile{animation:tile .5s cubic-bezier(.3,1.4,.5,1) forwards}.scene.on .row .tile:nth-child(2){animation-delay:.25s}.scene.on .tile{animation-delay:1.6s}.scene.on .row .tile:nth-child(2){animation-delay:1.85s}
@keyframes tile{to{opacity:1;transform:none}}
/* price gauge: a marker slides from yesterday's price to today's, the stretch between them fills red (up) or green (down) */
.gauge2{position:relative;padding-top:calc(1*var(--u))}
.g-track{position:relative;height:calc(2.4*var(--u));background:var(--line);border-radius:99px}
.g-fill{position:absolute;top:0;bottom:0;border-radius:99px;transform:scaleX(0)}
.gauge2.up .g-fill{background:var(--up);transform-origin:left}.gauge2.down .g-fill{background:var(--down);transform-origin:right}.gauge2.flat .g-fill{background:var(--muted)}
.scene.on .g-fill{animation:gfill var(--ms) cubic-bezier(.3,.7,.2,1) var(--dl) forwards}
@keyframes gfill{to{transform:scaleX(1)}}
.g-y{position:absolute;top:calc(-1.4*var(--u));width:calc(.7*var(--u));height:calc(5.2*var(--u));margin-left:calc(-.35*var(--u));background:var(--muted);border-radius:2px}
.g-t{position:absolute;top:50%;width:calc(5*var(--u));height:calc(5*var(--u));margin:calc(-2.5*var(--u)) 0 0 calc(-2.5*var(--u));border-radius:50%;background:var(--fg);box-shadow:0 0 0 calc(1*var(--u)) rgba(230,237,243,.18),0 0 calc(4*var(--u)) rgba(230,237,243,.45);left:var(--p0)}
.scene.on .g-t{animation:gt var(--ms) cubic-bezier(.3,.7,.2,1) var(--dl) forwards}
@keyframes gt{from{left:var(--p0)}to{left:var(--p1)}}
.g-lab{position:relative;height:calc(6*var(--u));font:600 calc(3.2*var(--u)) var(--mono);color:var(--muted)}
.g-lab span{position:absolute;top:calc(1.6*var(--u));transform:translateX(-50%);white-space:nowrap}
/* day profile: the lowest and highest quarter-hours pop when the sweep reaches them */
.mk{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .25s ease,transform .45s cubic-bezier(.3,1.7,.5,1)}
.mk.hit{opacity:1;transform:none}
.mk .ring{fill:none;stroke-width:5;opacity:0}
.mk.hit .ring{animation:ring 1s ease-out}
@keyframes ring{0%{r:16;opacity:.9}100%{r:70;opacity:0}}
.spread line,.spread path{stroke-dasharray:1;stroke-dashoffset:1}
.spread.go line,.spread.go path{transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.2,1);stroke-dashoffset:0}
.spread text{opacity:0;transition:opacity .4s ease .5s}.spread.go text{opacity:1}
/* forward chart: the line draws itself, the end dot appears when it arrives */
.draw2{stroke-dasharray:1;stroke-dashoffset:1}
.scene.on .draw2{animation:draw2 var(--ms,1.8s) cubic-bezier(.4,.1,.2,1) var(--dl,.4s) forwards}
@keyframes draw2{to{stroke-dashoffset:0}}
.endpt{opacity:0}.scene.on .endpt{animation:rise .3s ease var(--dl2) forwards,endpulse 1.6s ease-in-out calc(var(--dl2) + .3s) infinite}
@keyframes endpulse{50%{r:18}}
.kick{font:700 calc(4.4*var(--u)) var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.h{font:800 calc(10.4*var(--u))/1.06 var(--sans);letter-spacing:-.01em;text-wrap:balance;hyphens:none}
.nw{white-space:nowrap}
.big{font:800 calc(25*var(--u))/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.unit{font:500 calc(4.4*var(--u)) var(--mono);color:var(--muted)}
.delta{font:800 calc(8.4*var(--u)) var(--mono);display:flex;flex-wrap:wrap;align-items:baseline;gap:calc(1*var(--u)) calc(2*var(--u))}
.delta .unit{white-space:nowrap}
.figline{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 calc(2*var(--u))}

#p-head{filter:drop-shadow(0 0 10px rgba(127,200,248,.85))}
#p-head,#p-cur{transition:opacity .4s ease}
.big.long{font-size:calc(19*var(--u))}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.sub{font:400 calc(4.8*var(--u))/1.4 var(--sans);color:var(--muted)}
.row{display:flex;gap:calc(3*var(--u))}
.tile{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:calc(2.5*var(--u));padding:calc(3.5*var(--u))}
.tile .l{white-space:nowrap;font:700 calc(3*var(--u)) var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:800 calc(8.5*var(--u)) var(--mono);margin-top:calc(1*var(--u))}
.tile .s{font:500 calc(3.3*var(--u)) var(--mono);color:var(--muted)}
svg{width:100%;height:auto;overflow:visible}
.brief{display:flex;flex-direction:column;gap:calc(3*var(--u))}
.brief div{background:var(--panel);border-left:calc(1*var(--u)) solid var(--amber);border-radius:calc(1.5*var(--u));padding:calc(4*var(--u)) calc(4*var(--u));font:400 calc(4.6*var(--u))/1.45 var(--sans)}

.event{background:var(--panel);border:1px solid var(--line);border-radius:calc(2.5*var(--u));padding:calc(5*var(--u))}
.brand{position:absolute;bottom:calc(7*var(--u));left:calc(8*var(--u));display:flex;align-items:center;gap:calc(2.4*var(--u));z-index:2}   /* small, bottom left, as on Instagram */
.brand .logo{width:calc(9*var(--u));height:auto;display:block}   /* the round logo and the name beside it, like an Instagram account */
.brand .who{display:flex;flex-direction:column;gap:calc(.4*var(--u))}.brand .who b{font:700 calc(3.6*var(--u)) var(--sans,system-ui);color:var(--fg)}
.brand .d{font:500 calc(2.8*var(--u)) var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bar{position:absolute;top:calc(5*var(--u));left:calc(8*var(--u));right:calc(8*var(--u));display:flex;gap:calc(1.2*var(--u));z-index:2}
.bar i{flex:1;height:calc(.7*var(--u));background:var(--line);border-radius:9px;overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:var(--fg)}
.bar i.done b{width:100%}
.bar i.run b{animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 2.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gauge{display:flex;align-items:center;gap:calc(3*var(--u))}
.batt{position:relative;flex:1;height:calc(9*var(--u));border:calc(.6*var(--u)) solid var(--fg);border-radius:calc(1.6*var(--u));padding:calc(.8*var(--u))}
.batt:after{content:"";position:absolute;right:calc(-2.2*var(--u));top:28%;width:calc(1.4*var(--u));height:44%;background:var(--fg);border-radius:0 4px 4px 0}
.batt.demo b{width:8%}.scene.on .batt.demo b{animation:demo 2.6s cubic-bezier(.4,0,.2,1) .5s forwards}
@keyframes demo{0%{width:8%;background:#7FC8F8}55%{width:96%;background:#7FC8F8}60%{width:96%;background:#FBBF24}100%{width:12%;background:#FBBF24}}
.batt b{display:block;height:100%;width:50%;background:var(--accent);border-radius:calc(.8*var(--u));transition:width .08s linear,background .2s}
.clock{font:800 calc(7*var(--u)) var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.act{font:700 calc(3.6*var(--u)) var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.money.punch{animation:punch .5s cubic-bezier(.3,1.6,.5,1)}
.money{display:inline-block;font:800 calc(12*var(--u)) var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.race{display:flex;flex-direction:column;gap:calc(1.1*var(--u))}
.race .r{display:grid;grid-template-columns:calc(24*var(--u)) 1fr;align-items:center;gap:calc(2*var(--u))}
.race .n{font:600 calc(3.6*var(--u)) var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race .t{height:calc(4.4*var(--u));display:flex;align-items:center}
.race .t i{display:block;height:100%;width:0;border-radius:calc(.8*var(--u));background:#3A4A5E;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.race .t span{font:700 calc(3.4*var(--u)) var(--mono);margin-left:calc(1.6*var(--u));white-space:nowrap;opacity:0;transition:opacity .4s ease .9s}
.race .r.fr .n{color:var(--accent);font-weight:800}.race .r.fr .t i{background:var(--accent)}
.race.go .t span{opacity:1}
.race .r.fr.win .t i{animation:frwin .5s ease 3}.race .r.fr.win .n{animation:frwin .5s ease 3}
@keyframes frwin{50%{filter:brightness(1.6);transform:scale(1.06)}}
.lg{display:flex;flex-wrap:wrap;gap:calc(1.5*var(--u)) calc(3.5*var(--u));font:600 calc(3.2*var(--u)) var(--mono);color:var(--muted)}
.lg i{display:inline-block;width:calc(2.6*var(--u));height:calc(2.6*var(--u));border-radius:2px;margin-right:calc(1.2*var(--u));vertical-align:-2px}
/* map: countries colour in from the cheapest to the dearest, their prices appear, then France's flows draw themselves */
.h-sm{font-size:calc(7.6*var(--u))}.sub.src{font-size:calc(3.2*var(--u))}
.scene > svg.map{flex:none}
/* the map scene: the map fills the frame from the top right, the words sit on the sea (Atlantic top left, Mediterranean below) */
.mapsc > svg.map{position:absolute;top:calc(9*var(--u));right:calc(-14*var(--u));width:calc(128*var(--u));height:auto;z-index:0;margin:0}
.mapsc > :not(svg){position:relative;z-index:1}
.mapsc > .kick,.mapsc > .h{max-width:calc(44*var(--u));text-shadow:0 calc(.4*var(--u)) calc(3*var(--u)) #000,0 0 calc(1.5*var(--u)) #000}
.mapsc > .sub.src{position:absolute;right:calc(8*var(--U));bottom:calc(8*var(--U));text-align:right;max-width:calc(46*var(--U));font-size:calc(2.6*var(--U));line-height:1.35;color:var(--fg);text-shadow:0 0 calc(2*var(--u)) #000,0 0 calc(1*var(--u)) #000,0 0 calc(.5*var(--u)) #000}
.mapsc > .say{margin-top:auto}
/* the map's title stays in the top left, over the Atlantic, clear of France */
.mapsc{padding-top:calc(14*var(--U))}.embed .mapsc{padding-top:calc(19*var(--U))}
.mapsc > .kick{font-size:calc(3.6*var(--U))}.mapsc > .h{font-size:calc(6.6*var(--U));max-width:calc(40*var(--U))}
.mapsc > svg.map{top:calc(13*var(--u));right:calc(-24*var(--u))}
.map .ctry{opacity:0}.scene.on .map .ctry{animation:ctry .5s ease var(--d) forwards}
@keyframes ctry{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.map .ctry{transform-box:fill-box;transform-origin:center}
.mlab{font:800 34px var(--mono);fill:#0B0F14;opacity:0}.scene.on .mlab{animation:rise .4s ease var(--d) forwards}
.map .flow line{stroke-dasharray:1;stroke-dashoffset:1}.scene.on .map .flow line{animation:draw2 .8s cubic-bezier(.3,.7,.2,1) var(--d) forwards}
.map .flow{filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.scene.on #m-fr{stroke:#fff;stroke-width:5}

.nuc-t{position:relative;height:calc(5*var(--u));background:var(--line);border-radius:99px;overflow:visible}
.nuc-f{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px}.scene.on .nuc-f{animation:nucf 1.2s cubic-bezier(.3,.7,.2,1) .3s forwards}

.nuc-l{position:relative;height:calc(6*var(--u));font:600 calc(3*var(--u)) var(--mono);color:var(--muted)}.nuc-l span{position:absolute;top:calc(1.8*var(--u));left:0;white-space:nowrap}
.nuc-l .end{left:auto;right:0}.nuc-top{position:relative;height:calc(6*var(--u));font:600 calc(3.2*var(--u)) var(--mono);color:var(--fg)}.nuc-top span{position:absolute;bottom:calc(1.6*var(--u));transform:translateX(-60%);white-space:nowrap}

.scene.on .sr{animation:rise .45s ease var(--d) forwards}

.scene > svg{flex:none}

<body>
<div id="stage">
  <div class="bar" id="bar"></div>
  <div id="scenes"></div>
  <div class="brand"><img class="logo" src="assets/logo-icon-yellow.png" alt="" aria-hidden="true"><div class="who"><b translate="no">PowerKlock</b><div class="d" id="brand-d"></div></div></div>
</div>
<script>
(function () {
  'use strict';
  const EN = location.hash === '#en';
  if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
  const T = (f, e) => EN ? e : f;
  const SCENE_MS = 3600;
  // the reel's pace: every duration and delay of the scenes is stretched by TS (CSS animations, word reveals, sweeps, counters, hold times)
  const TS = 1.4;
  const fmt = (v, d) => v == null || !isFinite(v) ? '–' : v.toLocaleString(EN ? 'en-GB' : 'fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const sgn = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '±') + fmt(Math.abs(v), d);
  const paris = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris' });
  const q = new URLSearchParams(location.search);
  const today = q.get('d') || paris.format(new Date());                       // ?d=YYYY-MM-DD replays a day
  const addDays = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
  const longDate = d => new Date(d + 'T12:00:00Z').toLocaleDateString(EN ? 'en-GB' : 'fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  const get = p => fetch(p, { cache: 'no-store' }).then(r => r.ok ? (p.endsWith('.csv') ? r.text() : r.json()) : null).catch(() => null);
  const dir = v => v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'flat';
  const arrow = v => v > 0.05 ? '▲' : v < -0.05 ? '▼' : '■';
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  // a phrase split into words that come in one after the other; a figure stays glued to its unit
  const words = (s, base = 0, step = 90, cls = 'w') => String(s).replace(/(\d)\s+(?=[€%$°]|GW|MW|TWh|pts)/g, '$1 ')
    .split(/ +/).map((w, i) => `<span class="${cls}" style="--d:${base + Math.round(i * step * 1.6)}ms">${w}</span>`).join(' ');

  // scene 1: the price counts from yesterday's to today's while a marker slides between the two on a gauge
  function priceScene(D0, D1) {
    const a = D0.avg, b = D1 && D1.avg, dv = b == null ? null : a - b, d = dir(dv || 0);
    const DL = 1000, MS = 1600;
    // the gauge is zoomed on yesterday's price (in the middle), so even a 1 % move travels a visible distance
    const R = b == null ? 1 : Math.max(Math.abs(dv) * 1.6, Math.abs(b) * 0.02, 1.5), pos = v => Math.max(4, Math.min(96, 50 + (v - b) / R * 50));
    const pa = b == null ? null : pos(a), pb = b == null ? null : 50;
    return { id: 'price', ms: 5600, sayAt: DL + MS + 300, say: dv == null ? T('Spot base France, day-ahead, moyenne du jour de livraison.', 'France day-ahead baseload spot, delivery-day average.') : Math.abs(dv) < 0.05 ? T('Spot base stable vs J-1.', 'Baseload spot flat on the day before.') : T(`Spot base FR à ${fmt(a, 1)} €/MWh, ${sgn(dv, 1)} € vs J-1.`, `Baseload spot ${dv > 0 ? 'up' : 'down'} ${fmt(Math.abs(dv), 1)} €/MWh on the day before.`), html: `<div class="kick">${T('Spot France · aujourd’hui', 'France spot · today')}</div>
      <div class="h">${words(T('Le prix de l’électricité', 'The power price'), 150, 110)}</div>
      <div class="figline"><span class="big${fmt(a, 1).length > 5 ? ' long' : ''}" data-count="${a}" data-from="${b == null ? 0 : b}" data-dec="1" data-delay="${b == null ? 300 : DL}" data-ms="${b == null ? 1100 : MS}" data-punch="1">${fmt(b == null ? a : b, 1)}</span> <span class="unit">€/MWh</span></div>
      ${pb == null ? '' : `<div class="gauge2 ${d}" style="--dl:${DL}ms;--ms:${MS}ms"><div class="g-track"><i class="g-fill" style="left:${Math.min(pa, pb)}%;width:${Math.abs(pa - pb)}%"></i><span class="g-y" style="left:${pb}%"></span><span class="g-t" style="--p0:${pb}%;--p1:${pa}%"></span></div>
        <div class="g-lab"><span style="left:${Math.max(12, Math.min(88, pb))}%">${T('hier', 'yesterday')} ${fmt(b, 0)}&nbsp;€</span></div></div>`}
      ${dv == null ? '' : `<div class="delta late ${d}" style="--late:${DL + MS - 100}ms"><span class="nw">${arrow(dv)} ${sgn(dv, 1)}&nbsp;€</span> <span class="unit">${T('vs J-1', 'vs yesterday')} (${sgn(dv / b * 100, 0)}&nbsp;%)</span></div>`}` };
  }
  function profileScene(D0) {
    // the full 96 quarter-hours, not a 24-point hourly mean: battery/solar swings are quarter-hour events,
    // averaging them into hours would understate the real peak-low spread
    const H = D0.hourly, N = H.length;
    const mn = Math.min(...H), mx = Math.max(...H), lo = Math.min(0, mn), W = 1000, Ht = 520;
    const x = i => i / (N - 1) * W, y = v => Ht - (v - lo) / (mx - lo || 1) * Ht;
    const pts = H.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const iMin = H.indexOf(mn), iMax = H.indexOf(mx), neg = D0.negH || 0;
    const hhmm = i => String(Math.floor(i / 4)).padStart(2, '0') + ':' + String(i % 4 * 15).padStart(2, '0');
    const SWEEP = 4000, TILES = SWEEP + 1100;
    // the label of a marker sits above or below its dot, kept inside the chart's width
    const lx = i => Math.max(70, Math.min(W - 70, x(i)));
    const mark = (cls, i, v, col, above) => `<g class="mk ${cls}"><circle class="ring" cx="${x(i)}" cy="${y(v)}" r="16" stroke="${col}"/>
      <circle cx="${x(i)}" cy="${y(v)}" r="16" fill="${col}"/><text x="${lx(i)}" y="${above ? y(v) - 34 : y(v) + 64}" text-anchor="middle" fill="${col}" font-family="JetBrains Mono" font-size="44" font-weight="800">${fmt(v, 0)} €</text></g>`;
    // after the sweep: the gap between the lowest and highest quarter-hour drawn as a bracket on the right
    const bx = W + 6, yMn = y(mn), yMx = y(mx);
    const hh = i => T(Math.floor(i / 4) + '\u00a0h' + (i % 4 ? String(i % 4 * 15).padStart(2, '0') : ''), hhmm(i));
    return { id: 'profile', ms: SWEEP + 3000, sayAt: SWEEP + 400, say: T(`Creux à ${fmt(mn, 0)} € (${hh(iMin)}), pointe à ${fmt(mx, 0)} € (${hh(iMax)}) : spread de ${fmt(mx - mn, 0)} €/MWh.`, `Low at ${hh(iMin)}, peak at ${hh(iMax)}: a ${fmt(mx - mn, 0)} €/MWh spread.`), html: `<div class="kick">${T('La journée quart d’heure par quart d’heure', 'The day, quarter-hour by quarter-hour')}</div>
      <div class="row" style="align-items:baseline;justify-content:space-between"><div class="clock" id="p-clock">00:00</div><div class="act" id="p-act" style="color:var(--muted)">–</div></div>
      <svg viewBox="-20 -60 1040 660" aria-hidden="true">
        ${lo < 0 ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#ED6965" stroke-dasharray="8 8"/>` : ''}
        <defs><clipPath id="p-clip"><rect id="p-cr" x="-20" y="-60" width="0" height="660"/></clipPath></defs>
        <g clip-path="url(#p-clip)"><polygon points="0,${Ht} ${pts} ${W},${Ht}" fill="rgba(127,200,248,.16)"/>
          <polyline points="${pts}" fill="none" stroke="#7FC8F8" stroke-width="7" stroke-linejoin="round"/></g>
        <line id="p-cur" x1="0" x2="0" y1="-60" y2="${Ht + 100}" stroke="#8DA2B8" stroke-width="3" stroke-dasharray="6 6"/>
        <g class="spread" id="p-spread">
          <line pathLength="1" x1="${x(iMin)}" x2="${bx}" y1="${yMn}" y2="${yMn}" stroke="#FBBF24" stroke-width="3" stroke-dasharray="1"/>
          <line pathLength="1" x1="${x(iMax)}" x2="${bx}" y1="${yMx}" y2="${yMx}" stroke="#FBBF24" stroke-width="3" stroke-dasharray="1"/>
          <path pathLength="1" d="M${bx},${yMn} L${bx},${yMx} M${bx - 14},${yMx + 20} L${bx},${yMx} L${bx + 14},${yMx + 20} M${bx - 14},${yMn - 20} L${bx},${yMn} L${bx + 14},${yMn - 20}" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        ${mark('mk-min', iMin, mn, '#4ADE80', false)}${mark('mk-max', iMax, mx, '#ED6965', true)}
        <circle id="p-head" cx="0" cy="${y(H[0])}" r="10" fill="#fff"/>
        ${[0, 24, 48, 72, 95].map(i => `<text x="${x(i)}" y="${Ht + 60}" text-anchor="middle" fill="#8DA2B8" font-family="JetBrains Mono" font-size="34">${Math.floor(i / 4)}&#160;h</text>`).join('')}
      </svg>
      ${neg ? `<div class="row"><div class="tile" style="animation-delay:${TILES}ms"><div class="l">${T('Heures ≤ 0 €', 'Hours ≤ 0 €')}</div><div class="v">${fmt(neg, neg % 1 ? 1 : 0)}</div><div class="s">${T('prix nuls ou négatifs', 'zero or negative')}</div></div></div>` : ''}`,
      play(root) {
        const clock = root.querySelector('#p-clock'), act = root.querySelector('#p-act'),
          cr = root.querySelector('#p-cr'), cur = root.querySelector('#p-cur'), head = root.querySelector('#p-head'),
          mkMin = root.querySelector('.mk-min'), mkMax = root.querySelector('.mk-max'), spread = root.querySelector('#p-spread');
        [mkMin, mkMax, spread].forEach(e => e.classList.remove('hit', 'go'));
        let lastI = -1;
        // t is a continuous position (0…N-1): the line and the head dot glide on every frame, the clock and
        // price only tick once per quarter-hour — the sweep stays fluid even though the data is stepped
        const paint = t => {
          t = Math.max(0, Math.min(N - 1, t));   // a stray rAF tick with a now before t0 must never go negative
          const i = Math.floor(t), i1 = Math.min(N - 1, i + 1), fr = t - i, xx = x(t), yy = y(H[i] + (H[i1] - H[i]) * fr);
          cr.setAttribute('width', 20 + t / (N - 1) * (W + 40)); cur.setAttribute('x1', xx); cur.setAttribute('x2', xx);
          head.setAttribute('cx', xx); head.setAttribute('cy', yy);
          // the low and the high only show up when the sweep gets to them
          if (t >= iMin) mkMin.classList.add('hit');
          if (t >= iMax) mkMax.classList.add('hit');
          if (i !== lastI) { lastI = i;
            clock.textContent = hhmm(i); act.textContent = fmt(H[i], 0) + ' €/MWh';
            act.style.color = i === iMin ? 'var(--down)' : i === iMax ? 'var(--up)' : 'var(--muted)'; }
        };
        if (reduced()) { paint(N - 1); spread.classList.add('go'); return; }
        const t0 = performance.now();
        const step = now => {
          const f = Math.min(1, (now - t0) / (SWEEP * TS));
          paint(f * (N - 1));
          if (f < 1) requestAnimationFrame(step);
          else setTimeout(() => { head.style.opacity = 0; cur.style.opacity = 0; spread.classList.add('go'); }, 250 * TS);
        };
        head.style.opacity = 1; cur.style.opacity = 1;
        requestAnimationFrame(step);
      } };
  }
  // scene 3: two months of the next calendar year draw themselves, then the last session's move lands
  function calScene(cal) {
    const DRAW = 1900, DL = 500, s = cal.series, W = 1000, Ht = 230;
    const lo = Math.min(...s), hi = Math.max(...s), x = i => i / (s.length - 1) * W, y = v => Ht - 12 - (v - lo) / ((hi - lo) || 1) * (Ht - 24);
    const pts = s.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const d = dir(cal.dv), col = d === 'up' ? '#ED6965' : d === 'down' ? '#4ADE80' : '#8DA2B8';
    const land = DL + DRAW;
    return { id: 'cal', ms: 5800, sayAt: land + 400, say: Math.abs(cal.dv) < 0.005 ? T(`Cal-${String(cal.y).slice(2)} base stable à la clôture, ${fmt(cal.v, 2)} €/MWh.`, `Cal-${String(cal.y).slice(2)} France baseload flat at settlement.`) : T(`Cal-${String(cal.y).slice(2)} base clôture à ${fmt(cal.v, 2)} €/MWh, ${sgn(cal.dv, 2)} € sur la séance.`, `Cal-${String(cal.y).slice(2)} France baseload: ${sgn(cal.dv, 2)} €/MWh at settlement.`), html: `<div class="kick">${T('Marché à terme', 'Forward market')}</div>
      <div class="h">${words(T('Électricité livrée en ' + cal.y, 'Power delivered in ' + cal.y), 150, 110)}</div>
      <svg viewBox="-10 -30 1030 ${Ht + 80}" aria-hidden="true" style="--ms:${DRAW}ms;--dl:${DL}ms;--dl2:${land}ms">
        <polyline class="draw2" pathLength="1" points="${pts}" fill="none" stroke="#7FC8F8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
        <circle class="endpt" cx="${x(s.length - 1)}" cy="${y(s[s.length - 1])}" r="13" fill="${col}"/>
        <text x="0" y="${Ht + 46}" fill="#8DA2B8" font-family="JetBrains Mono" font-size="32">${new Date(cal.d0 + 'T12:00:00Z').toLocaleDateString(EN ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' })}</text>
        <text x="${W}" y="${Ht + 46}" text-anchor="end" fill="#8DA2B8" font-family="JetBrains Mono" font-size="32">${new Date(cal.d + 'T12:00:00Z').toLocaleDateString(EN ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' })}</text>
      </svg>
      <div class="figline"><span class="big${fmt(cal.v, 2).length > 5 ? ' long' : ''}" data-count="${cal.v}" data-from="${cal.v - cal.dv}" data-dec="2" data-delay="${land - 700}" data-ms="900" data-punch="1">${fmt(cal.v - cal.dv, 2)}</span> <span class="unit">€/MWh</span></div>
      <div class="delta late ${d}" style="--late:${land + 150}ms"><span class="nw">${arrow(cal.dv)} ${sgn(cal.dv, 2)}&nbsp;€</span> <span class="unit">${T('en une séance', 'in one session')}</span></div>
      <div class="sub" style="animation-delay:${land + 600}ms">${T('Contrat Cal', 'Cal')} ${cal.y} ${T('base France, cotation du', 'France baseload, settlement of')} ${new Date(cal.d + 'T12:00:00Z').toLocaleDateString(EN ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'long', timeZone: 'UTC' })}.</div>` };
  }
  function mondayScene(week, go) {
    return `<div class="kick">${T('La semaine', 'The week')}</div>
      <div class="h">${words(T('Ce qui a bougé', 'What moved'), 150, 110)}</div>
      <div class="row"><div class="tile"><div class="l">${T('Spot, semaine dernière', 'Spot, last week')}</div><div class="v">${fmt(week.v, 1)}</div><div class="s">€/MWh · <span style="color:var(--${dir(week.dv) === 'up' ? 'up' : dir(week.dv) === 'down' ? 'down' : 'muted'})">${sgn(week.dv, 1)}</span></div></div></div>
      ${go ? `<div class="row"><div class="tile"><div class="l">${T('Garanties d’origine', 'Guarantees of origin')} ${go.y}</div><div class="v">${fmt(go.v, 2)}</div><div class="s">€/MWh · <span style="color:var(--${dir(go.dv) === 'up' ? 'up' : dir(go.dv) === 'down' ? 'down' : 'muted'})">${sgn(go.dv, 2)} ${T('sur la semaine', 'on the week')}</span></div></div></div>` : ''}`;
  }
  function eventScene(e) {
    const i = EN ? 1 : 0;
    return `<div class="kick">${T('À retenir', 'Key event')}</div>
      <div class="event"><div class="h">${words(e.title[i], 350, 80)}</div><p class="sub">${e.text[i]}</p><div class="sub">${T('Source', 'Source')} : ${e.source[0]}</div></div>`;
  }
  // last scene: the brief's points come one at a time, read word by word; the earlier ones step back
  // the first sentence of a point is its gist; three full paragraphs would not fit a 9:16 frame
  const first = s => { const t = String(s || ''), m = t.match(/^.+?[.!?](?=\s+[A-ZÀ-Ý«]|$)/); return m ? m[0] : t; };
  function briefScene(dg) {
    const items = (dg.context || []).slice(0, 3), GAP = 1900, FIRST = 600;
    return { id: 'brief', ms: FIRST + items.length * GAP + 900, html: `<div class="kick">${T('Le point marché', 'Market brief')}</div>
      <div class="brief">${items.map(c => `<div class="${c.tone === 'up' ? 'up' : c.tone === 'down' ? 'down' : ''}"><b>${EN ? c.topic_en : c.topic} ${c.tone === 'up' ? '▲' : c.tone === 'down' ? '▼' : ''}</b>${words(first(EN ? c.text_en : c.text), 150, 55, 'wb')}</div>`).join('')}</div>`,
      play(root) {
        const it = [...root.querySelectorAll('.brief > div')];
        it.forEach(e => e.classList.remove('in', 'dim'));
        if (reduced()) { it.forEach(e => e.classList.add('in')); return; }
        it.forEach((e, k) => setTimeout(() => { it.slice(0, k).forEach(p => p.classList.add('dim')); e.classList.add('in'); }, (FIRST + k * GAP) * TS));
        // at the end, all of them back at full strength for a last look
        setTimeout(() => it.forEach(e => e.classList.remove('dim')), (FIRST + items.length * GAP) * TS);
      } };
  }

  // CO₂: two months of the front-December EUA draw themselves, then the last session's move lands; its weight in a gas plant's cost
  function carbonScene(pts, contract) {
    const k0 = Math.max(0, pts.length - 42), s = pts.slice(k0).map(p => p[1]), n = s.length, v = s[n - 1], dv = v - s[n - 2];
    const DRAW = 1900, DL = 500, W = 1000, Ht = 230, land = DL + DRAW;
    const lo = Math.min(...s), hi = Math.max(...s), x = i => i / (n - 1) * W, y = q => Ht - 12 - (q - lo) / ((hi - lo) || 1) * (Ht - 24);
    const d = dir(dv), col = d === 'up' ? '#ED6965' : d === 'down' ? '#4ADE80' : '#8DA2B8';
    const dd = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString(EN ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    const ccgt = 0.37 * v;   // a gas plant emits about 0.37 t of CO₂ per MWh produced
    return { id: 'co2', ms: 5800, sayAt: land + 400, say: T(`EUA Déc. à ${fmt(v, 2)} €/t, ${sgn(dv, 2)} € sur la séance. Coût CO₂ d’un CCGT ≈ ${fmt(ccgt, 0)} €/MWh.`, `EUA Dec: ${sgn(dv, 2)} €/t on the session. That is ≈ ${fmt(ccgt, 0)} €/MWh in a gas plant’s cost.`),
      html: `<div class="kick">${T('Carbone · EUA', 'Carbon · EUA')}</div>
      <div class="h">${words(T('Le prix du CO₂', 'The price of CO₂'), 150, 110)}</div>
      <svg viewBox="-10 -30 1030 ${Ht + 80}" aria-hidden="true" style="--ms:${DRAW}ms;--dl:${DL}ms;--dl2:${land}ms">
        <polyline class="draw2" pathLength="1" points="${s.map((q, i) => x(i).toFixed(1) + ',' + y(q).toFixed(1)).join(' ')}" fill="none" stroke="#B8C9D9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
        <circle class="endpt" cx="${x(n - 1)}" cy="${y(v)}" r="13" fill="${col}"/>
        <text x="0" y="${Ht + 46}" fill="#8DA2B8" font-family="JetBrains Mono" font-size="32">${dd(pts[k0][0])}</text>
        <text x="${W}" y="${Ht + 46}" text-anchor="end" fill="#8DA2B8" font-family="JetBrains Mono" font-size="32">${dd(pts[pts.length - 1][0])}</text>
      </svg>
      <div class="figline"><span class="big" data-count="${v}" data-from="${v - dv}" data-dec="2" data-delay="${land - 700}" data-ms="900" data-punch="1">${fmt(v - dv, 2)}</span> <span class="unit">€/t</span></div>
      <div class="delta late ${d}" style="--late:${land + 150}ms"><span class="nw">${arrow(dv)} ${sgn(dv, 2)}&nbsp;€</span> <span class="unit">${T('en une séance', 'in one session')}</span></div>
      <div class="sub" style="animation-delay:${land + 600}ms">${contract || 'EUA'} · SEFE Energy market cockpit, ${T('cotation du', 'price of')} ${dd(pts[pts.length - 1][0])}</div>` };
  }

  // ── map: today's day-ahead price country by country (cheapest first), then France's physical flows border by border ──
  const MAP_ZONES = { FR: ['FR'], DE: ['DE_LU'], LU: ['DE_LU'], BE: ['BE'], NL: ['NL'], ES: ['ES'], PT: ['PT'], AT: ['AT'], CH: ['CH'],
    CZ: ['CZ'], SK: ['SK'], HU: ['HU'], PL: ['PL'], RO: ['RO'], HR: ['HR'], SI: ['SI'], RS: ['RS'], BG: ['BG'], GR: ['GR'], MK: ['MK'],
    ME: ['ME'], FI: ['FI'], EE: ['EE'], LV: ['LV'], LT: ['LT'], IT: ['IT_NORD', 'IT_CNOR', 'IT_CSUD', 'IT_SUD', 'IT_CALA', 'IT_SICI', 'IT_SARD'],
    DK: ['DK_E', 'DK_W'], SE: ['SE', 'SE_1', 'SE_2', 'SE_3', 'SE_4'], NO: ['NO_1', 'NO_2', 'NO_3', 'NO_4', 'NO_5'] };   // as js/power-map.js
  const RAMP = [[-20, [59, 130, 246]], [0, [20, 211, 169]], [60, [245, 235, 77]], [130, [249, 115, 22]], [250, [190, 30, 45]]];   // the site's price scale
  const rampCol = v => { if (v <= RAMP[0][0]) return 'rgb(' + RAMP[0][1] + ')';
    for (let i = 1; i < RAMP.length; i++) if (v <= RAMP[i][0]) { const [a, ca] = RAMP[i - 1], [b, cb] = RAMP[i], t = (v - a) / (b - a);
      return 'rgb(' + ca.map((c, j) => Math.round(c + (cb[j] - c) * t)).join(',') + ')'; }
    return 'rgb(' + RAMP[RAMP.length - 1][1] + ')'; };
  const FLOW_N = { DE_LU: ['Allemagne', 'Germany', 'DE'], BE: ['Belgique', 'Belgium', 'BE'], ES: ['Espagne', 'Spain', 'ES'], IT_NORD: ['Italie', 'Italy', 'IT'], CH: ['Suisse', 'Switzerland', 'CH'], GB: ['Royaume-Uni', 'Great Britain', 'GB'] };
  function mapScene(geo, zones, cb) {
    const x0 = -14, x1 = 30, y0 = 34.5, y1 = 62, W = 1000, H = Math.round(W * (y1 - y0) / ((x1 - x0) * Math.cos(49 * Math.PI / 180)));
    const px = lon => (lon - x0) / (x1 - x0) * W, py = lat => (y1 - lat) / (y1 - y0) * H;
    const ring = r => 'M' + r.map(([lo, la]) => px(lo).toFixed(1) + ',' + py(la).toFixed(1)).join('L') + 'Z';
    const price = iso => { const v = (MAP_ZONES[iso] || []).map(z => zones[z] && zones[z].avg).filter(v => v != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    const F = geo.features.map(f => ({ iso: f.properties.iso, lx: f.properties.lx, ly: f.properties.ly, v: price(f.properties.iso),
      d: (f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates).map(pg => ring(pg[0])).join('') }));
    const priced = F.filter(f => f.v != null).sort((a, b) => a.v - b.v), order = new Map(priced.map((f, i) => [f.iso, i]));
    // the colour follows today's range, not a fixed scale: on a dear day every country would be the same red
    const vLo = priced[0].v, vHi = priced[priced.length - 1].v, vMid = priced[Math.floor(priced.length / 2)].v;
    const dayCol = v => { const t = v <= vMid ? 0.5 * (v - vLo) / ((vMid - vLo) || 1) : 0.5 + 0.5 * (v - vMid) / ((vHi - vMid) || 1);
      const st = [[0, [20, 211, 169]], [0.5, [245, 235, 77]], [0.8, [249, 115, 22]], [1, [190, 30, 45]]];
      for (let i = 1; i < st.length; i++) if (t <= st[i][0]) { const [a, ca] = st[i - 1], [b, cb2] = st[i], u = (t - a) / (b - a); return 'rgb(' + ca.map((c, j) => Math.round(c + (cb2[j] - c) * u)).join(',') + ')'; }
      return 'rgb(190,30,45)'; };
    const STEP = 70, FILL = 300 + priced.length * STEP;
    const paths = F.map(f => `<path d="${f.d}" fill="${f.v == null ? '#1A2330' : dayCol(f.v)}" stroke="#0B0F14" stroke-width="2.5"${f.v == null ? '' : ` class="ctry" style="--d:${300 + order.get(f.iso) * STEP}ms"`}${f.iso === 'FR' ? ' id="m-fr"' : ''}/>`).join('');
    const LAB = ['FR', 'DE', 'ES', 'IT', 'PL', 'SE', 'FI', 'RO', 'NO', 'PT', 'GR', 'HU'];
    const labs = F.filter(f => f.v != null && LAB.includes(f.iso) && f.lx != null).map(f => { const x = px(f.lx), y = py(f.ly); if (x < 20 || x > W - 20 || y < 20 || y > H - 20) return '';
      return `<text class="mlab" x="${x.toFixed(0)}" y="${y.toFixed(0)}" text-anchor="middle" style="--d:${FILL + 200}ms"${f.iso === 'FR' ? ' fill="#fff" font-size="44"' : ''}>${fmt(f.v, 0)}</text>`; }).join('');
    // France's borders: arrow from the exporter to the importer, width by the mean flow
    const fr = F.find(f => f.iso === 'FR'), FX = px(fr.lx), FY = py(fr.ly), rows = ((cb && cb.countries && cb.countries.FR) || []).map(r => ({ k: r.partner.split(' ')[0], net: r.net })).filter(r => FLOW_N[r.k] && r.net);
    const arrows = rows.map((r, i) => { const pf = F.find(f => f.iso === FLOW_N[r.k][2]); if (!pf) return '';
      let ax = px(pf.lx), ay = py(pf.ly), bx = FX, by = FY; if (r.net < 0) [ax, ay, bx, by] = [bx, by, ax, ay];   // net > 0: France imports
      const sx = ax + (bx - ax) * .22, sy = ay + (by - ay) * .22, ex = ax + (bx - ax) * .74, ey = ay + (by - ay) * .74, w = Math.max(6, Math.min(22, Math.sqrt(Math.abs(r.net)) / 2.6));
      const col = r.net > 0 ? '#FFFFFF' : '#7FC8F8';
      return `<g class="flow" style="--d:${FILL + 700 + i * 260}ms"><line x1="${sx.toFixed(0)}" y1="${sy.toFixed(0)}" x2="${ex.toFixed(0)}" y2="${ey.toFixed(0)}" stroke="${col}" stroke-width="${w.toFixed(1)}" stroke-linecap="round" marker-end="url(#ah${r.net > 0 ? 'i' : 'e'})" pathLength="1"/></g>`; }).join('');
    const net = rows.reduce((a, r) => a + r.net, 0) / 1000, nm = r => FLOW_N[r.k][2];   // ISO codes: short, and the terms of the trade
    const imp = rows.filter(r => r.net > 0).sort((a, b) => b.net - a.net).map(nm), exp = rows.filter(r => r.net < 0).sort((a, b) => a.net - b.net).map(nm);
    const asc = priced, rk = asc.findIndex(f => f.iso === 'FR') + 1;
    const ord = r => EN ? (r === 1 ? '1st' : r === 2 ? '2nd' : r === 3 ? '3rd' : r + 'th') : (r === 1 ? '1ʳᵉ' : r + 'ᵉ');
    const list = a => a.join(', ');
    const say = !rows.length ? T(`France : ${ord(rk)} prix le plus bas sur ${asc.length} pays.`, `France: ${ord(rk)} lowest price of ${asc.length} countries.`)
      : T(`FR ${net > 0 ? 'importatrice' : 'exportatrice'} nette, ${fmt(Math.abs(net), 1)} GW · import ${list(imp) || '–'} · export ${list(exp) || '–'}`,
          `Net ${net > 0 ? 'importer' : 'exporter'} ${fmt(Math.abs(net), 1)} GW · imports ${list(imp) || '–'} · exports ${list(exp) || '–'}`);
    return { id: 'map', cls: 'mapsc', ms: FILL + 700 + rows.length * 260 + 2200, sayAt: FILL + 900, say,
      html: `<div class="kick">${T('Spot base · Europe', 'Baseload spot · Europe')}</div>
      <div class="h h-sm">${words(T(`France : ${ord(rk)} prix le plus bas sur ${asc.length}`, `France: ${ord(rk)} lowest of ${asc.length}`), 150, 90)}</div>
      <svg class="map" viewBox="0 0 ${W} ${H}" aria-hidden="true" preserveAspectRatio="xMaxYMin meet"><defs>
        <marker id="ahi" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#FFFFFF"/></marker>
        <marker id="ahe" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7FC8F8"/></marker></defs>

  }
  // ── nuclear: available capacity against the operator's forecast and the installed fleet ──
  function nuclearScene(av, fc) {

    const W = 1000, Ht = 200, lo = Math.min(...s), hi = Math.max(...s, f || 0), x = i => i / (n - 1) * W, y = q => Ht - 10 - (q - lo) / ((hi - lo) || 1) * (Ht - 20);
    const col = gap == null ? '#B8C9D9' : gap < -0.3 ? '#ED6965' : gap > 0.3 ? '#4ADE80' : '#B8C9D9';
    return { id: 'nuclear', ms: 5600, sayAt: 2600, say: gap == null ? T(`Dispo nucléaire ${fmt(v, 1)} GW sur ${fmt(INST / 1000, 0)} GW installés.`, `Nuclear availability: ${fmt(v, 1)} GW of ${fmt(INST / 1000, 0)} GW installed.`)

      <div class="nuc">${f == null ? '' : `<div class="nuc-top"><span style="left:${(f / (INST / 1000) * 100).toFixed(1)}%">${T('prévision', 'forecast')} ${fmt(f, 1)}</span></div>`}<div class="nuc-t"><i class="nuc-f" style="--w:${(v / (INST / 1000) * 100).toFixed(1)}%;background:${col}"></i>${f == null ? '' : `<span class="nuc-m" style="left:${(f / (INST / 1000) * 100).toFixed(1)}%"></span>`}</div>

  // ── clean spark spread: today's baseload minus the gas and CO₂ cost of a 49 % gas plant (formula of the site's spark page) ──
  function sparkScene(zones, ttf, eua) {
    const Z = [['FR', 'France', 'France'], ['DE_LU', 'Allemagne', 'Germany'], ['BE', 'Belgique', 'Belgium'], ['NL', 'Pays-Bas', 'Netherlands'], ['IT_NORD', 'Italie N.', 'Italy N.'], ['ES', 'Espagne', 'Spain'], ['PL', 'Pologne', 'Poland']];
    const css = v => v - ttf / 0.4913 - eua * 0.202 / 0.4913;
    const R = Z.filter(([k]) => zones[k] && zones[k].avg != null).map(([k, f, e]) => ({ k, n: EN ? e : f, v: css(zones[k].avg) })).sort((a, b) => b.v - a.v);
    const mx = Math.max(...R.map(r => Math.abs(r.v)), 1), fr = R.find(r => r.k === 'FR');
    return { id: 'spark', ms: 5200, sayAt: 600 + R.length * 160 + 900, say: fr ? (fr.v > 0 ? T(`Clean spark base FR à +${fmt(fr.v, 0)} €/MWh : le CCGT est dans la monnaie.`, `France clean spark: +${fmt(fr.v, 0)} €/MWh. A gas plant covers its gas and CO₂ at the baseload spot.`)
        : T(`Clean spark base FR à ${sgn(fr.v, 0)} €/MWh : le CCGT est hors de la monnaie.`, `France clean spark: ${sgn(fr.v, 0)} €/MWh. At the baseload spot, a gas plant does not cover its gas and CO₂.`)) : '',
      html: `<div class="kick">${T('Clean spark spread · base', 'Clean spark spread · baseload')}</div>
      <div class="h">${words(T('La marge d’un CCGT', 'A CCGT’s margin'), 150, 100)}</div>
      <div class="sprk">${R.map((r, i) => `<div class="sr${r.k === 'FR' ? ' fr' : ''}" style="--d:${600 + i * 160}ms"><span class="n">${r.n}</span><span class="t"><i class="${r.v < 0 ? 'neg' : ''}" style="--w:${(Math.abs(r.v) / mx * 50).toFixed(1)}%"></i></span><span class="v">${sgn(r.v, 0)}</span></div>`).join('')}</div>
      <div class="sub">${T(`Spot base − TTF ${fmt(ttf, 1)} €/MWh ÷ 49 % − EUA ${fmt(eua, 1)} €/t × 0,202 ÷ 49 % (CCGT 49 % PCI), en €/MWh.`, `Baseload spot − TTF ${fmt(ttf, 1)} €/MWh ÷ 49 % − EUA ${fmt(eua, 1)} €/t × 0.202 ÷ 49 %, in €/MWh.`)}</div>` };
  }

  // ── PPA: the day's PowerKlock benchmark (the site's pricer, default settings), solar and wind side by side ──
  function ppaScene(bm) {
    const days = Object.keys(bm.days).sort(), L = bm.days[days[days.length - 1]], W = bm.days[days[Math.max(0, days.length - 6)]] || {};
    const dd = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString(EN ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    const tY = (L.tenor || '').split('-'), cal3 = tY.length > 1 ? tY[0].slice(2) + '–' + tY[tY.length - 1].slice(2) : (L.tenor || '');   // the strip the PPA is priced on: Cal 27–29
    const TT = [['solar', T('Solaire', 'Solar'), '#FBBF24'], ['wind', T('Éolien', 'Wind'), '#7FC8F8']].filter(([t]) => L[t] && L[t].ppa != null);
    const col = TT.map(([t, n, c], j) => { const x = L[t], d = W[t] && W[t].ppa != null ? x.ppa - W[t].ppa : null, ser = days.slice(-60).map(k => bm.days[k][t] && bm.days[k][t].ppa).filter(v => v != null);
      const lo = Math.min(...ser), hi = Math.max(...ser), sx = 300 / Math.max(1, ser.length - 1), sy = v => 110 - (v - lo) / ((hi - lo) || 1) * 100;
      const pc = x.ref ? x.ppa / x.ref * 100 : null;
      return `<div class="ppa-c" style="--c:${c};--d:${400 + j * 500}ms"><div class="ppa-n">${n}</div>
        <div class="ppa-v"><span data-count="${x.ppa}" data-from="${d == null ? x.ppa * .9 : x.ppa - d}" data-dec="1" data-delay="${600 + j * 500}" data-ms="1100" data-punch="1">${fmt(x.ppa, 1)}</span></div><div class="ppa-u">€/MWh</div>
        ${d == null ? '' : `<div class="ppa-d ${dir(d)}">${arrow(d)} ${sgn(d, 1)} € <span>${T('5 j', '5 d')}</span></div>`}
        <svg viewBox="-4 -6 308 124" aria-hidden="true" style="--ms:1300ms;--dl:${900 + j * 500}ms;--dl2:${2200 + j * 500}ms"><polyline class="draw2" pathLength="1" points="${ser.map((v, i) => (i * sx).toFixed(1) + ',' + sy(v).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"/></svg>
        ${pc == null ? '' : `<div class="ppa-r"><span data-count="${pc}" data-dec="0" data-delay="${1500 + j * 500}" data-ms="1000" data-punch="1">${fmt(pc, 0)}</span> %</div><div class="ppa-pl">${T('du Cal ' + cal3 + ' base', 'of Cal ' + cal3 + ' baseload')}</div><div class="ppa-p"><i style="--w:${Math.min(100, pc).toFixed(0)}%"></i></div>`}
        ${x.lo != null ? `<div class="ppa-pl">P10–P90 ${fmt(x.lo, 0)}–${fmt(x.hi, 0)} €</div>` : ''}</div>`; }).join('');
    const part = TT.map(([t, n]) => `${n.toLowerCase()} ${fmt(L[t].ppa, 1)} €/MWh${L[t].ref ? ` (${fmt(L[t].ppa / L[t].ref * 100, 0)} % ${T('du Cal', 'of Cal')})` : ''}`).join(', ');
    const ten = (L.tenor || '').split('-'), tn = ten.length > 1 ? ten[0] + '–' + ten[ten.length - 1].slice(2) : L.tenor;

      html: `<div class="kick">${T('PPA France · benchmark PowerKlock', 'France PPA · PowerKlock benchmark')}</div>
      <div class="h">${words(T(`Le prix d’un PPA ${tn}`, `The price of a ${tn} PPA`), 150, 100)}</div>
      <div class="ppa">${col}</div>
      <div class="sub">${T(`Pricer PowerKlock, réglages par défaut : pay-as-produced, arrêt sous 0 €. % du Cal : prix fixe ÷ Cal base ${cal3} (moyenne pondérée). Calcul du ${dd(days[days.length - 1])}`, `The site’s pricer, default settings: pay-as-produced, nothing paid below 0 €. % of Cal: fixed price ÷ Cal ${cal3} baseload (weighted mean). Run of ${dd(days[days.length - 1])}`)}</div>` };
  }

  async function main() {

      get('data/history/fr_market_calchain.json'), get('data/market_digest.json'), get('data/events.json'), get('data/go_prices.csv'),
      get('data/history/bess_da.json'), get('data/history/commodities_series.json'), get('data/geo/europe.json'), get('data/crossborder.json'), get('data/commodities.json'), get('data/history/ppa_benchmark.json')]);

    // Cal+1: the last two settlements of next year's baseload contract
    const y1 = +today.slice(0, 4) + 1, c = chain && chain.FR && chain.FR.years && chain.FR.years[String(y1)];
    if (c && c.values && c.values.length > 1) {
      const n = c.values.length, k0 = Math.max(0, n - 42);   // about two months of sessions for the curve
      S.push(calScene({ y: y1, v: c.values[n - 1], dv: c.values[n - 1] - c.values[n - 2], d: c.dates[n - 1], d0: c.dates[k0], series: c.values.slice(k0) }));

    // the same last TTF and EUA closes as the spark of data/prices.json (scripts/fetch_data.py)
    const cl = k => { const q = cm && cm.series && cm.series[k] && cm.series[k].points; return q && q.length ? q[q.length - 1][1] : null; };

  }

  // ── reel 2: a battery through the day (data/history/bess_da.json, the optimal schedule of the day) ──
  function battScenes(doc) {
    const E = doc && doc.example, X = E && E['2h'];
    if (!X || E.d !== today) return null;
    const p = E.price, gw = doc.params.grid_withdrawal, wear = X.wear, L = doc.summary_ltm['2h'];
    const cum = []; let acc = 0;
    p.forEach((v, t) => { acc += (v * X.discharge[t] - (v + gw) * X.charge[t]) * 0.25; cum.push(acc); });
    const W = 1000, H = 420, lo = Math.min(0, ...p), hi = Math.max(...p), x = t => t / 95 * W, y = v => H - (v - lo) / (hi - lo || 1) * H;
    const line = p.map((v, t) => x(t).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const bars = p.map((v, t) => X.charge[t] > 0.01 ? `<rect class="q" data-t="${t}" x="${x(t) - 4}" y="${y(v)}" width="9" height="${H - y(v)}" fill="#7FC8F8" opacity="0"/>`
      : X.discharge[t] > 0.01 ? `<rect class="q" data-t="${t}" x="${x(t) - 4}" y="${y(v)}" width="9" height="${H - y(v)}" fill="#FBBF24" opacity="0"/>` : '').join('');
    const intro = { ms: 3800, sayAt: 2200, say: T('Arbitrage day-ahead : charge au creux, décharge à la pointe.', 'Day-ahead arbitrage: charge in the low hours, discharge at the peak.'), html: `<div class="kick">${T('Une batterie de 1 MW, 2 h', 'A 1 MW, 2 h battery')}</div>
      <div class="h">${words(T('Acheter au creux, revendre au pic', 'Buy low, sell at the peak'), 150, 110)}</div>
      <div class="gauge"><div class="batt demo"><b></b></div></div>` };
    const SWEEP = 9000;
    const sweep = { ms: SWEEP + 1800, sayAt: 800, say: T('Bleu : charge. Jaune : décharge. Compteur : marge cumulée.', 'Blue: charging. Yellow: discharging. The counter adds up the margin.'), html: `<div class="kick">${T('La journée en accéléré', 'The day, fast-forward')}</div>
      <div class="row" style="align-items:baseline;justify-content:space-between"><div class="clock" id="b-clock">00:00</div><div class="act" id="b-act" style="color:var(--muted)">${T('à l’arrêt', 'waits')}</div></div>
      <svg viewBox="-10 -40 1020 520" aria-hidden="true"><defs><clipPath id="b-clip"><rect id="b-cr" x="-10" y="-40" width="0" height="560"/></clipPath></defs>
        <polyline points="${line}" fill="none" stroke="#243042" stroke-width="5"/>
        <g clip-path="url(#b-clip)"><polyline points="${line}" fill="none" stroke="#E6EDF3" stroke-width="6" stroke-linejoin="round"/></g>${bars}
        <line id="b-cur" x1="0" x2="0" y1="-30" y2="${H}" stroke="#8DA2B8" stroke-width="3" stroke-dasharray="6 6"/></svg>
      <div class="lg"><span><i style="background:#7FC8F8"></i>${T('achète (charge)', 'buys (charges)')}</span><span><i style="background:#FBBF24"></i>${T('revend (décharge)', 'sells (discharges)')}</span></div>
      <div class="gauge"><div class="batt"><b id="b-soc"></b></div><div class="money" id="b-eur">0 €</div></div>`,
      play(root) {
        const t0 = performance.now(), clock = root.querySelector('#b-clock'), act = root.querySelector('#b-act'), soc = root.querySelector('#b-soc'),
          eur = root.querySelector('#b-eur'), cr = root.querySelector('#b-cr'), cur = root.querySelector('#b-cur'), qs = [...root.querySelectorAll('.q')];
        const step = now => {
          const f = Math.min(1, (now - t0) / (SWEEP * TS)), t = Math.min(95, Math.floor(f * 96));
          clock.textContent = String(Math.floor(t / 4)).padStart(2, '0') + ':' + String(t % 4 * 15).padStart(2, '0');
          const c = X.charge[t] > 0.01, d = X.discharge[t] > 0.01;
          act.textContent = c ? T('achète à ', 'buys at ') + fmt(p[t], 0) + ' €' : d ? T('revend à ', 'sells at ') + fmt(p[t], 0) + ' €' : T('attend', 'waits');
          act.style.color = c ? '#7FC8F8' : d ? '#FBBF24' : 'var(--muted)';
          soc.style.width = (X.soc[t] * 100).toFixed(1) + '%';
          soc.style.background = d ? '#FBBF24' : '#7FC8F8';
          const v = cum[t]; eur.textContent = (v < 0 ? '−' : '+') + fmt(Math.abs(v), 0) + ' €'; eur.style.color = v < 0 ? 'var(--up)' : 'var(--down)';
          cr.setAttribute('width', x(t) + 10); cur.setAttribute('x1', x(t)); cur.setAttribute('x2', x(t));
          qs.forEach(r => { if (+r.dataset.t <= t) r.setAttribute('opacity', '.9'); });
          if (f < 1) requestAnimationFrame(step); else { eur.classList.remove('punch'); void eur.offsetWidth; eur.classList.add('punch'); }
        };
        requestAnimationFrame(step);
      } };
    const net = X.rev - wear;
    const result = { ms: 4200, sayAt: 2200, say: T(`Marge nette BESS 1 MW / 2 h : ${fmt(net, 0)} €/MW, dégradation déduite.`, `Net margin of the day: ${fmt(net, 0)} €/MW, wear deducted.`), html: `<div class="kick">${T('Batterie 1 MW, 2 h · aujourd’hui', '1 MW, 2 h battery · today')}</div>
      <div class="figline"><span class="big" data-count="${net}" data-dec="0" data-delay="300" data-ms="1300" data-punch="1">${fmt(net, 0)}</span> <span class="unit">${T('€ de marge par MW', '€ earned per MW')}</span></div>
      <div class="sub" style="animation-delay:1.7s">${T('Après ', 'After ')}${fmt(wear, 0)}&nbsp;€ ${T('de dégradation, sur le seul day-ahead.', 'of battery wear, on the day-ahead market alone.')}</div>
      <div class="row"><div class="tile"><div class="l">${T('Sur 12 mois', 'Over 12 months')}</div><div class="v nw">${fmt(L.pw, 0)}&nbsp;k€</div><div class="s">${T('par MW et par an', 'per MW per year')}</div></div>
        <div class="tile"><div class="l">${T('Cycles', 'Cycles')}</div><div class="v">${fmt(L.cycles_day, 1)}</div><div class="s">${T('par jour en moyenne', 'per day on average')}</div></div></div>` };
    return [intro, sweep, result];
  }
  async function battery() {
    run(battScenes(await get('data/history/bess_da.json')) || [`<div class="h">${T('Programme du jour pas encore calculé.', 'Today’s schedule not computed yet.')}</div>`]);
  }

  // ── reel 3: today's price across Europe, a bar race (data/history/daily/<today>.json, all zones) ──
  const ZONES = { FR: ['France', 'France'], DE_LU: ['Allemagne', 'Germany'], BE: ['Belgique', 'Belgium'], NL: ['Pays-Bas', 'Netherlands'], ES: ['Espagne', 'Spain'],
    PT: ['Portugal', 'Portugal'], IT_NORD: ['Italie Nord', 'Italy North'], AT: ['Autriche', 'Austria'], CH: ['Suisse', 'Switzerland'], PL: ['Pologne', 'Poland'],
    CZ: ['Tchéquie', 'Czechia'], DK_W: ['Danemark O.', 'Denmark W.'], NO_1: ['Norvège Sud', 'Norway South'], SE: ['Suède', 'Sweden'], FI: ['Finlande', 'Finland'] };
  function europeScenes(f) {
    const z = f && f.zones;
    if (!z || !z.FR) return null;
    const L = Object.keys(ZONES).filter(k => z[k] && z[k].avg != null).map(k => ({ k, n: ZONES[k][EN ? 1 : 0], v: z[k].avg })).sort((a, b) => b.v - a.v);
    const asc = L.slice().sort((a, b) => a.v - b.v), rank = asc.findIndex(r => r.k === 'FR') + 1, max = L[0].v, min = asc[0];
    const ord = r => EN ? (r === 1 ? '1st' : r === 2 ? '2nd' : r === 3 ? '3rd' : r + 'th') : (r === 1 ? '1ʳᵉ' : r + 'ᵉ');
    const race = { ms: 8000, sayAt: 1600 + L.length * 180, say: T('Spot base day-ahead, moyenne du jour, par zone de prix.', 'Day-ahead baseload spot, daily average, by bidding zone.'), html: `<div class="kick">${T('Prix moyen du jour · €/MWh', 'Average price · €/MWh')}</div>
      <div class="h">${words(T('France : ' + ord(rank) + ' prix le plus bas sur ' + L.length, 'France: ' + ord(rank) + ' lowest price of ' + L.length), 150, 90)}</div>
      <div class="race" id="race">${L.map(r => `<div class="r${r.k === 'FR' ? ' fr' : ''}"><div class="n">${r.n}</div><div class="t"><i data-w="${Math.max(2, r.v / max * 100).toFixed(1)}"></i><span>${fmt(r.v, 0)}</span></div></div>`).join('')}</div>`,
      play(root) {
        const rows = [...root.querySelectorAll('.race .t i')];
        rows.forEach((el, i) => setTimeout(() => { el.style.width = 'calc(' + el.dataset.w + '% - 14*var(--u))'; }, (400 + (rows.length - 1 - i) * 180) * TS));
        const race = root.querySelector('#race'), fr = root.querySelector('.race .r.fr');
        race.classList.remove('go'); if (fr) fr.classList.remove('win');
        setTimeout(() => race.classList.add('go'), (400 + rows.length * 180) * TS);
        // once every bar is in, France flashes: the eye lands on its rank
        if (fr) setTimeout(() => fr.classList.add('win'), (1600 + rows.length * 180) * TS);
      } };
    const gap = z.FR.avg - min.v;
    const outro = { ms: 4600, sayAt: 2400, say: T(`Écart France / zone la moins chère : ${fmt(gap, 0)} €/MWh.`, `Gap France / cheapest zone: ${fmt(gap, 0)} €/MWh.`), html: `<div class="kick">${T('À retenir', 'Takeaway')}</div>
      <div class="figline"><span class="big" data-count="${z.FR.avg}" data-dec="0" data-delay="250" data-ms="1100" data-punch="1">${fmt(z.FR.avg, 0)}</span> <span class="unit">€/MWh ${T('en France', 'in France')}</span></div>
      <div class="sub" style="animation-delay:1.3s">${T('Le moins cher : ', 'Cheapest: ')}${min.n}, ${fmt(min.v, 0)}&nbsp;€.</div>
      <div class="sub" style="animation-delay:1.9s">${T('Le plus cher : ', 'Dearest: ')}${L[0].n}, ${fmt(L[0].v, 0)}&nbsp;€.</div>
` };
    return [race, outro];
  }
  async function europe() {
    run(europeScenes(await get('data/history/daily/' + today + '.json')) || [`<div class="h">${T('Prix du jour pas encore publiés.', 'Today’s prices not published yet.')}</div>`]);
  }

  // ── reel 4: yesterday's production hour by hour under the price (data/history/daily/<yesterday>.json) ──
  async function mix() {
    const dy = addDays(today, -1), f = await get('data/history/daily/' + dy + '.json'), F = f && f.zones && f.zones.FR;
    const ok = k => F && Array.isArray(F[k]) && F[k].length === 96;
    if (!ok('hourly') || !ok('nuclear') || !ok('solar')) return run([`<div class="h">${T('Production d’hier pas encore complète.', 'Yesterday’s output not complete yet.')}</div>`]);
    const hr = a => Array.from({ length: 24 }, (_, i) => a.slice(i * 4, i * 4 + 4).reduce((s, v) => s + (v || 0), 0) / 4 / 1000);   // GW per hour
    const SER = [['nuclear', T('Nucléaire', 'Nuclear'), '#E6C86E'], ['hydro', T('Hydraulique', 'Hydro'), '#5B8DEF'], ['wind', T('Éolien', 'Wind'), '#7FC8F8'],
      ['solar', T('Solaire', 'Solar'), '#FBBF24'], ['fossil', T('Gaz et fossiles', 'Gas and fossil'), '#8D99AE']].filter(([k]) => ok(k)).map(([k, n, c]) => ({ k, n, c, v: hr(F[k]) }));
    const price = hr(F.hourly).map(v => v * 1000);
    const tot = Array.from({ length: 24 }, (_, i) => SER.reduce((s, x) => s + x.v[i], 0)), top = Math.max(...tot) * 1.08;
    const W = 1000, H = 560, x = i => i / 23 * W, y = v => H - v / top * H;
    const pl = Math.min(0, ...price), ph = Math.max(...price), yp = v => H - (v - pl) / (ph - pl || 1) * H * .9;
    let base = Array(24).fill(0);
    const areas = SER.map(sr => {
      const up = base.map((b, i) => b + sr.v[i]);
      const pts = up.map((v, i) => x(i) + ',' + y(v)).join(' ') + ' ' + base.map((v, i) => x(i) + ',' + y(v)).reverse().join(' ');
      base = up; return `<polygon points="${pts}" fill="${sr.c}" opacity=".85"/>`;
    }).join('');
    const pline = price.map((v, i) => x(i) + ',' + yp(v)).join(' ');
    const sol = SER.find(s => s.k === 'solar'), hSol = sol.v.indexOf(Math.max(...sol.v)), hMin = price.indexOf(Math.min(...price)), hMax = price.indexOf(Math.max(...price));
    const SWEEP = 8000;
    const sweep = { ms: SWEEP + 1500, sayAt: 900, say: T('Production par filière (GW) et spot day-ahead (ligne blanche).', 'Output by source in GW, day-ahead price in white.'), html: `<div class="kick">${T('Hier en France · heure par heure', 'Yesterday in France · hour by hour')}</div>
      <div class="row" style="align-items:baseline;justify-content:space-between"><div class="clock" id="m-clock">0 h</div><div class="act" id="m-p">–</div></div>
      <svg viewBox="-10 -30 1020 660" aria-hidden="true"><defs><clipPath id="m-clip"><rect id="m-cr" x="-10" y="-30" width="0" height="700"/></clipPath></defs>
        <g clip-path="url(#m-clip)">${areas}<polyline points="${pline}" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></g>
        ${[0, 6, 12, 18, 23].map(i => `<text x="${x(i)}" y="${H + 50}" text-anchor="middle" fill="#8DA2B8" font-family="JetBrains Mono" font-size="32">${i}&#160;h</text>`).join('')}</svg>
      <div class="lg">${SER.map(s => `<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}<span><i style="background:#fff;height:3px;vertical-align:4px"></i>${T('prix', 'price')}</span></div>`,
      play(root) {
        const t0 = performance.now(), cr = root.querySelector('#m-cr'), ck = root.querySelector('#m-clock'), pe = root.querySelector('#m-p');
        const step = now => {
          const f = Math.min(1, (now - t0) / (SWEEP * TS)), i = Math.min(23, Math.floor(f * 24));
          cr.setAttribute('width', 10 + f * (W + 10)); ck.textContent = i + ' h';
          pe.textContent = fmt(price[i], 0) + ' €/MWh · ' + T('solaire ', 'solar ') + fmt(sol.v[i], 1) + ' GW';
          pe.style.color = price[i] <= price[hMin] + 5 ? 'var(--down)' : price[i] >= price[hMax] - 5 ? 'var(--up)' : 'var(--muted)';
          if (f < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      } };
    const solarDay = Math.abs(hSol - hMin) <= 2 && sol.v[hSol] > 3;
    const head = solarDay ? T('Le solaire fait baisser le prix de midi', 'Solar digs the midday price') : T('Le prix culmine à la pointe du soir', 'The price follows the evening demand');
    const take = { ms: 5000, sayAt: 2400, say: T(`Prix minimum à ${hMin}\u00a0h, maximum à ${hMax}\u00a0h.`, `Lowest price at ${hMin}:00, highest at ${hMax}:00.`), html: `<div class="kick">${T('À retenir', 'What we saw')}</div>
      <div class="h">${words(head, 150, 100)}</div>
      <div class="row"><div class="tile"><div class="l">${T('Prix le plus bas', 'Lowest price')}</div><div class="v nw"><span class="big-sm" data-count="${price[hMin]}" data-dec="0" data-delay="1700" data-ms="900">${fmt(price[hMin], 0)}</span>&nbsp;€</div><div class="s"><span class="nw">${T('à ', 'at ')}${hMin}&nbsp;h</span><br><span class="nw">${T('solaire', 'solar')} ${fmt(sol.v[hMin], 1)}&nbsp;GW</span></div></div>
        <div class="tile"><div class="l">${T('Prix le plus haut', 'Highest price')}</div><div class="v nw"><span class="big-sm" data-count="${price[hMax]}" data-dec="0" data-delay="1950" data-ms="900">${fmt(price[hMax], 0)}</span>&nbsp;€</div><div class="s"><span class="nw">${T('à ', 'at ')}${hMax}&nbsp;h</span><br><span class="nw">${T('solaire', 'solar')} ${fmt(sol.v[hMax], 1)}&nbsp;GW</span></div></div></div>
      <div class="sub" style="animation-delay:2.7s">${T('Production réelle par filière (ENTSO-E) et spot day-ahead, moyennes horaires.', 'Actual output by source (ENTSO-E) and day-ahead price, hourly means.')}</div>` };
    document.getElementById('brand-d').textContent = longDate(dy);
    run([sweep, take], true);
  }

  // plays the scenes: strings or {html, ms, play(root)}; window.REEL_DONE once the last one has run its time
  function run(S, keepDate) {
    S = S.map(x => typeof x === 'string' ? { html: x, ms: SCENE_MS } : Object.assign({ ms: SCENE_MS }, x));
    // the subtitle: one plain sentence per scene, read word by word (≈ 230 words a minute), the scene stays until it is read
    S.forEach(x => { if (!x.say) return; const n = String(x.say).split(/ +/).length, at = x.sayAt == null ? 900 : x.sayAt;   // base times: run() stretches them by TS
      x.html += `<div class="say" style="animation-delay:${Math.max(0, at - 300)}ms">${String(x.say).replace(/(\d)\s+(?=[€%$°]|GW|MW|TWh|pts)/g, '$1\u00a0').replace(/ ([:;?!])/g, '\u00a0$1').split(/ +/).map((w, i) => `<span class="k" style="--d:${at + i * 260}ms">${w}</span>`).join(' ')}</div>`;
      x.ms = Math.max(x.ms, at + n * 260 + 1600); });
    S.forEach(x => { x.ms = Math.round(x.ms * 1.35 * TS); });   // each scene holds a third longer once its animation ends: time to read
    if (!keepDate) document.getElementById('brand-d').textContent = longDate(today);
    document.getElementById('scenes').innerHTML = S.map(x => '<section class="scene' + (x.cls ? ' ' + x.cls : '') + '">' + x.html + '</section>').join('');
    document.getElementById('bar').innerHTML = S.map(() => '<i><b></b></i>').join('');
    // a scene with more to show than the frame holds shrinks a little (everything is sized in --u) until it fits
    const fit = () => document.querySelectorAll('.scene').forEach(sc => { sc.style.removeProperty('--u');
      const u0 = parseFloat(getComputedStyle(document.getElementById('stage')).getPropertyValue('--u')) || 3.6;
      // too full = the last block ends below the scene's bottom padding (where the logo and Instagram's caption sit)
      // (layout boxes, not the on-screen ones: the blocks wait slightly lower until their scene comes in)
      const over = () => { const l = sc.lastElementChild; if (!l) return false;
        return l.offsetTop + l.offsetHeight > sc.clientHeight - parseFloat(getComputedStyle(sc).paddingBottom) + 1; };
      for (let f = 1, k = 0; over() && k < 14; k++) { f *= 0.95; sc.style.setProperty('--u', (u0 * f) + 'px'); } });
    fit(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    const sc = [...document.querySelectorAll('.scene')], bars = [...document.querySelectorAll('#bar i')];
    let k = 0, prev = -1;
    const show = () => {
      sc.forEach((s, i) => { s.classList.toggle('on', i === k); s.classList.toggle('out', i === prev && i !== k); });
      bars.forEach((b, i) => { b.className = i < k ? 'done' : i === k ? 'run' : ''; if (i === k) b.firstChild.style.animationDuration = S[k].ms + 'ms'; });
      // replay the curve drawing each time its scene comes back
      sc[k].querySelectorAll('.draw').forEach(p => { p.classList.remove('draw'); void p.getBoundingClientRect(); p.classList.add('draw'); });
      // the big figures count from where they were (yesterday, the previous session; 0 by default) to their value,
      // after their own delay, then land with a small punch
      sc[k].querySelectorAll('[data-count]').forEach(el => {
        const to = +el.dataset.count, from = +(el.dataset.from || 0), dec = +el.dataset.dec, dur = +(el.dataset.ms || 1100) * TS, start = performance.now() + +(el.dataset.delay || 0) * TS;
        el.classList.remove('punch');
        if (reduced()) { el.textContent = fmt(to, dec); return; }
        el.textContent = fmt(from, dec);
        const step = now => { const x = Math.max(0, Math.min(1, (now - start) / dur)), e = 1 - Math.pow(1 - x, 3); el.textContent = fmt(from + (to - from) * e, dec);
          if (x < 1) requestAnimationFrame(step); else if (el.dataset.punch) { void el.offsetWidth; el.classList.add('punch'); } };
        requestAnimationFrame(step);
      });
      if (S[k].play) S[k].play(sc[k]);
      // the scene's CSS animations and transitions (they start with its .on class) play at the reel's pace, delays included
      requestAnimationFrame(() => [sc[k], ...(prev >= 0 ? [sc[prev]] : [])].forEach(el => el.getAnimations({ subtree: true }).forEach(a => { a.playbackRate = 1 / TS; })));
      left = S[k].ms; t0 = performance.now(); timer = setTimeout(next, left);
    };
    let timer = null, t0 = 0, left = 0;
    // the site's stories hold the reel on a long press: the scene's timer stops, its CSS animations freeze
    window.addEventListener('message', e => { const m = e.data; if (!m || m.pkReel !== 'pause' || e.source !== parent) return;
      if (m.on && timer) { clearTimeout(timer); timer = null; left -= performance.now() - t0; document.documentElement.classList.add('held'); }
      else if (!m.on && !timer && k < S.length) { t0 = performance.now(); timer = setTimeout(next, Math.max(0, left)); document.documentElement.classList.remove('held'); } });
    const next = () => {
      prev = k;
      k += 1;
      if (k >= S.length) { window.REEL_DONE = true; if (parent !== window) parent.postMessage({ pkReel: 'done' }, location.origin); if (q.has('once')) return; k = 0; }
      show();
    };
    window.REEL_SCENES = S.length;
    window.REEL_MS = S.reduce((a, x) => a + x.ms, 0);
    if (parent !== window) parent.postMessage({ pkReel: 'start', ms: window.REEL_MS, scenes: S.length }, location.origin);
    show();
  }

  const R = { jour: main, batterie: battery, europe, mix };
  (R[q.get('r')] || main)();
})();
</script>
</body>
