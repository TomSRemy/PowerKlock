name: Fetch Energy Data
on:
  schedule:
    # GitHub queues scheduled runs, worst on the hour: the '0 5' and '0 12' runs started 4-5 h late every day.
    # Off-minute slots, more of them (the concurrency group keeps one at a time; a run with nothing new commits nothing):
    - cron: '7 4 * * *'    # night: yesterday finalised
    - cron: '37 5 * * *'   # before the market opens (07:37 Paris in summer, 06:37 in winter)
    - cron: '17 11 * * *'  # day-ahead results (published ~12:45 CET)
    - cron: '47 12 * * *'  # second chance for the day-ahead results
    - cron: '23 16 * * *'  # afternoon
    # retry slots: they only fetch if a main zone (France first) is missing for the day that should be in
    - cron: '13,43 6-9 * * *'
    - cron: '3,23,53 11-17 * * *'
  workflow_dispatch:       # bouton manuel dans GitHub
  push:                    # a change to the fetch runs it at once (GitHub's schedule can be hours late)
    branches: [main]
    paths: ['scripts/fetch_data.py', 'scripts/heal_price_gaps.py', 'scripts/check_prices_complete.py', '.github/workflows/fetch.yml']

concurrency:
  group: fetch-energy-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests==2.33.1
      - name: Anything missing? (retry slots only)
        id: check
        run: |
          case "${{ github.event.schedule }}" in
            '13,43 6-9 * * *'|'3,23,53 11-17 * * *') python scripts/check_prices_complete.py ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Fetch data from ENTSO-E
        if: steps.check.outputs.run == 'true'
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/fetch_data.py
      - name: Fill the holes of the price history (a main zone missing from a past day)
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/heal_price_gaps.py
      # News also refreshed here: GitHub's scheduler can skip or delay the
      # dedicated 3-hourly workflow for hours, this one runs twice a day.
      - name: Fetch news feeds
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_news.py
      # France day-ahead prices by year for Tools › Carbon footprint
      - name: Build yearly France price files
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/build_fr_prices_year.py
      - name: Data API index
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/build_api_index.py
      # Negative hours by month × hour for Prices › Negative prices
      - name: Build negative-price profile
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/build_neg_profile.py
      - name: Commit and push data files
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/
          # If no changes, exit cleanly
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "data: update $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Retry up to 5 times if main has moved (manual push during this run)
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Failed to push after 5 attempts."
          exit 1
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
