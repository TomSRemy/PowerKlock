name: FR balancing activation prices

# Prices of activated balancing energy in France (ENTSO-E A84: aFRR, mFRR, up and down),
# day by day → data/history/fr_activation.json (scripts/fetch_fr_activation.py), for the Imbalance page.

on:
  schedule:
    - cron: '15 7 * * *'     # every morning
  push:
    branches: [main]
    paths: ['scripts/fetch_fr_activation.py', '.github/workflows/fetch_fr_activation.yml']
  workflow_dispatch:

concurrency:
  group: fetch-fr-activation
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.33.1
      - name: Activation prices
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/fetch_fr_activation.py || echo "::warning::activation prices not read"
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/history/fr_activation.json 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -q -m "data: FR activation prices $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
