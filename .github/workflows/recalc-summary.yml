name: Recalc Summary

on:
  workflow_dispatch:

jobs:
  recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.33.1

      - name: Recalc summary from daily files
        run: |
          echo "Running: python scripts/enrich_summary.py"
          python scripts/enrich_summary.py

      - name: Commit and push summary
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/history/summary.json data/history/summary_fr.json
          if git diff --cached --quiet; then
            echo "No changes to commit — summary already up to date"
          else
            git commit -m "recalc: refresh summary.json (incl. intraday profiles by Q)"
            # a data job may have pushed meanwhile: rebase on it, then push (5 tries)
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 8; done; exit 1
          fi

      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
