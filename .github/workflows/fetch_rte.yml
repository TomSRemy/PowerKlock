name: Fetch RTE (éCO2mix France, M0 reference prices)

# RTE data on ODRÉ (Etalab 2.0):
# - éCO2mix national generation, load and exchanges, Paris quarter-hours
#   → data/history/rte/YYYY-MM.json + fr_daily.json (scripts/fetch_rte_eco2mix.py).
#   The site reads today and the two previous days live from ODRÉ.
# - PP1 / PP2 peak-period days (RTE Data Portal Signal API, secrets
#   RTE_CLIENT_ID / RTE_CLIENT_SECRET) → data/rte_pp.json.
# - wind & solar curves of the complément de rémunération, weighted by the
#   France day-ahead history → data/m0.json (scripts/fetch_rte_m0.py).

on:
  schedule:
    - cron: '10 6 * * *'     # 06:10 UTC, complete previous day
    - cron: '10 18 * * *'    # 18:10 UTC (also PP2 signals of 19:00 Paris in winter)
    - cron: '50 8 * * *'     # 08:50 UTC: PP1 signals (09:30 Paris)
  workflow_dispatch:
    inputs:
      month_from:
        description: 'éCO2mix history from (YYYY-MM, empty = last three months)'
        required: false
        default: ''
      month_to:
        description: 'éCO2mix history to (YYYY-MM, empty = this month)'
        required: false
        default: ''

concurrency:
  group: fetch-rte
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: éCO2mix France
        env:
          FROM: ${{ inputs.month_from }}
          TO: ${{ inputs.month_to || inputs.month_from }}
        run: |
          if [ -n "$FROM" ]; then python scripts/fetch_rte_eco2mix.py --from "$FROM" --to "$TO"
          else python scripts/fetch_rte_eco2mix.py; fi
      - name: Months the second source disagrees with (Energy-Charts), fetched again
        continue-on-error: true
        run: |
          for M in $(python3 -c "import json;d=json.load(open('data/history/market_check.json'));print(' '.join(sorted({r['day'][:7] for r in (d.get('generation') or {}).get('days') or []})))" 2>/dev/null); do
            echo "RTE $M fetched again"; python scripts/fetch_rte_eco2mix.py --from "$M" --to "$M" || true
          done
      - name: Compute M0
        run: python scripts/fetch_rte_m0.py
      - name: Output of the parks under complément de rémunération (ODRÉ, monthly)
        run: python scripts/fetch_cr_production.py || echo "::warning::CR production not refreshed"
      - name: CRE renewable tender results
        run: python scripts/fetch_cre_tenders.py || echo "::warning::CRE tenders not refreshed"
      - name: Public cost of the support to renewables (CRE deliberation each July, read once a year)
        run: pip install -q pypdf==6.21.2 && python scripts/fetch_cspe.py || echo "::warning::CSPE not read"
      - name: CRE M0, PowerKlock estimate and forecast
        run: pip install -q openpyxl==3.1.5 && python scripts/fetch_cre_m0.py || echo "::warning::CRE M0 failed"
      - name: France solar / wind capture by day (PPA pricer)
        run: python scripts/build_fr_capture.py || echo "::warning::capture build failed"
      - name: France hourly price and production by year (PPA pricer, FPC methods)
        run: python scripts/build_fr_hourly.py || echo "::warning::hourly build failed"
      - name: PP1 / PP2 signals (needs an RTE Data Portal account)
        env:
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
        run: python scripts/fetch_rte_pp.py || echo "::warning::RTE PP signals failed"
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/m0.json data/history/rte data/history/fr_capture.json data/history/fr_hourly data/cre_m0.json data/history/cr_production.json data/cre_tenders.json data/cspe.json; git add data/rte_pp.json data/rte_pp_raw.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "data: RTE éCO2mix France and M0 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null
            sleep 8
          done
          exit 1
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
