name: FR imbalance cost (solar, wind)

# Basic national imbalance cost for the PPA pricer:
# day-ahead forecast error (ENTSO-E A69 vs RTE éCO2mix) × (imbalance price A85 − spot)
# → data/history/fr_imbalance_cost.json (scripts/fetch_fr_imbalance_cost.py).

on:
  schedule:
    - cron: '30 6 * * 1'     # Mondays 06:30 UTC: the last two months again
    - cron: '20 9 * * *'     # every day 09:20 UTC: the imbalance prices of the last 4 days only
  push:                      # first run (24 months) as soon as the script lands
    branches: [main]
    paths: ['scripts/fetch_fr_imbalance_cost.py', '.github/workflows/fetch_fr_imbalance.yml']
  workflow_dispatch:

concurrency:
  group: fetch-fr-imbalance
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests==2.33.1
      - name: Imbalance cost
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "20 9 * * *" ]; then
            python scripts/fetch_fr_imbalance_cost.py --prices 4
          else
            python scripts/fetch_fr_imbalance_cost.py
          fi
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/history/fr_imbalance_cost.json data/history/fr_imbalance_price
          if git diff --staged --quiet; then
            echo "No change — skipping commit."
            exit 0
          fi
          git commit -m "data: FR imbalance cost $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          exit 1

      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
