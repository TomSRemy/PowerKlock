name: Probe Modo Energy (temporary)
# Temporary: reads Modo Energy's website terms (automated collection?) and one French article page. Removed after reading.
on:
  push:
    branches: [claude/brave-dijkstra-0b04zg]
    paths: ['.github/workflows/probe_modo.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (PowerKlock news fetcher; +https://github.com/TomSRemy/PowerKlock)"
          curl -sL -m 30 -A "$UA" -o /tmp/t https://modoenergy.com/website-terms-of-service -w '%{http_code}\n'
          python3 - <<'PY'
          import re, html
          t = html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"(?s)<(script|style)[^>]*>.*?</\1>", " ", open("/tmp/t", errors="ignore").read())))
          t = re.sub(r"\s+", " ", t)
          print("length", len(t))
          for m in re.finditer(r"[^.]{0,300}(scrap|crawl|robot|spider|automat|data mining|harvest|extract|bot\b|reproduc|framing|RSS|link to)[^.]{0,300}\.", t, re.I):
              print("-", m.group(0).strip()[:700]); print()
          PY
          curl -sL -m 20 -A "$UA" -o /tmp/a https://modoenergy.com/research/fr/france-bess-buildout-q3-2026 -w '%{http_code}\n'
          grep -oE '<title>[^<]*</title>|<meta (property|name)="(og:description|article:published_time)"[^>]*>' /tmp/a | head -4
