name: Publish

# The site is served from the `site` branch (GitHub Pages and the Cloudflare Worker point at it), and only
# this workflow moves it. After a push to main:
#   · only data changed (the collection bots, every few minutes): `site` moves at once;
#   · code changed: `site` moves once every test has passed (the same as the Site tests workflow).
# A change that breaks a page therefore never reaches the site. Until the hosting points at `site`, this
# workflow only keeps the branch up to date and changes nothing for the visitors.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      after:
        description: 'run that started this one (ignored when looking for a run still going)'
        required: false
        default: ''

# One run at a time, without GitHub's concurrency group (it cancels the waiting run whenever a newer push
# arrives, and every cancelled run sends an e-mail). Instead: a run that starts while an older one is still
# going ends at once, successfully; the older one, when it finishes, starts a new run if main has moved,
# so the newest version is always published, one after the other.

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write     # to start the next run when main moved during this one
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Another publish still running?
        id: busy
        run: |
          me=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at)
          older=$(gh run list -R "${{ github.repository }}" --workflow publish.yml --limit 30 --json databaseId,status,createdAt \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and (.databaseId | tostring) != \"${{ github.event.inputs.after }}\" and (.status == \"in_progress\" or .status == \"queued\") and .createdAt < \"$me\")] | length")
          if [ "${older:-0}" -gt 0 ]; then
            echo "busy=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::An older publish is running; it will start a new run for this commit when it ends."
          else
            echo "busy=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.busy.outputs.busy == 'no'
        with: { fetch-depth: 1 }
      - name: Code changed since the published version?
        if: steps.busy.outputs.busy == 'no'
        id: diff
        run: |
          git fetch -q --depth=1 origin site || true
          if ! git rev-parse -q --verify origin/site >/dev/null; then echo "code=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          # compare every top-level entry except data/ (trees are compared by hash, no history needed)
          A=$(git ls-tree HEAD | grep -v -P '\tdata$'); B=$(git ls-tree origin/site | grep -v -P '\tdata$')
          if [ "$A" = "$B" ]; then echo "code=no" >> "$GITHUB_OUTPUT"; else echo "code=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.diff.outputs.code == 'yes'
        with: { python-version: '3.12' }
      - name: Tests (code changed)
        if: steps.diff.outputs.code == 'yes'
        run: |
          pip install -q playwright==1.48.0 requests==2.33.1 ruff==0.17.2
          python -m playwright install --with-deps chromium
          ruff check scripts tests warehouse
          for f in js/*.js js/*/*.js; do case "$f" in js/vendor/*) continue;; esac; node --check "$f" || exit 1; done
          python tests/test_calculations.py
          python tests/test_prices_dst.py
          python tests/test_site_logic.py
          python tests/test_ppa_frozen.py
          python tests/test_consistency.py
          python tests/smoke.py
      - name: Move the site branch
        if: steps.busy.outputs.busy == 'no'
        run: |
          # `site` is written only here and always equals a tested main: replaced, not merged.
          # Never move it back: if it already holds a newer commit than this one, leave it.
          git fetch -q --depth=1 origin site || true
          if git rev-parse -q --verify origin/site >/dev/null \
             && [ "$(git log -1 --format=%ct origin/site)" -gt "$(git log -1 --format=%ct HEAD)" ]; then
            echo "::notice::site already holds a newer commit"; exit 0
          fi
          for i in 1 2 3; do git push -q --force origin HEAD:refs/heads/site && exit 0; sleep 5; done; exit 1
      - name: Main moved during this run? Start the next one
        if: always() && steps.busy.outputs.busy == 'no'
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            gh workflow run publish.yml -R "${{ github.repository }}" --ref main -f after=${{ github.run_id }} && echo "::notice::next run started for $head"
          fi
      - name: E-mail on failure
        if: failure() && steps.busy.outputs.busy == 'no'
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
