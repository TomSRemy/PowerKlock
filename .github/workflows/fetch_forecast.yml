name: Fetch forecasts (solar, wind, load · today and tomorrow)

# TSO day-ahead forecasts (ENTSO-E, served by Energy-Charts) for FR, DE, BE,
# NL, ES → data/forecast.json (scripts/fetch_forecast.py). The morning run
# also refreshes the last 30 days of forecasts and actuals
# (data/history/forecast/) and the usual error shown on the site.

on:
  schedule:
    - cron: '15 6 * * *'     # morning: today + error over 30 days
    - cron: '30 7,8,9,10,11 * * *'   # tomorrow's forecasts: from the morning on, so the price forecast shows before the 13:00 auction
    - cron: '30 16 * * *'
    - cron: '30 19 * * *'    # late publishers
  workflow_dispatch:
    inputs:
      accuracy:
        description: 'Also refresh the 30-day error'
        type: boolean
        default: true

concurrency:
  group: fetch-forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}   # France load forecast for tomorrow before Energy-Charts serves it
        run: |
          if [ "${{ github.event.schedule }}" = "15 6 * * *" ] || [ "${{ inputs.accuracy }}" = "true" ]; then
            python scripts/fetch_forecast.py --accuracy
          else
            python scripts/fetch_forecast.py
          fi
      # our solar and wind first (tomorrow runs on weather alone until the TSO publishes, late afternoon), then the
      # price model on them, then our forecast again with the fresh chance of a negative price
      - name: PowerKlock combined solar and wind forecast (France)
        run: pip install -q numpy==2.5.4 && cd scripts && python fcst_live.py || echo "::warning::combined forecast failed"
      - name: Negative prices, today and tomorrow
        run: python scripts/neg_forecast.py || echo "::warning::negative-price forecast failed"
      - name: Combined forecast, second pass
        run: cd scripts && python fcst_live.py || echo "::warning::combined forecast failed"
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/forecast.json data/history/forecast data/neg_forecast.json data/fr_fc_combined.json
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "data: forecasts $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null
            sleep 8
          done
          exit 1
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
