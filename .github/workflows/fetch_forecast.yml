name: Fetch forecasts (solar, wind, load · today and tomorrow)

# TSO day-ahead forecasts (ENTSO-E, served by Energy-Charts) for FR, DE, BE,
# NL, ES → data/forecast.json (scripts/fetch_forecast.py). The morning run
# also refreshes the last 30 days of forecasts and actuals
# (data/history/forecast/) and the usual error shown on the site.

on:
  schedule:
    # off the :00/:15/:30 marks, where GitHub delays or drops scheduled runs most (26 Oct 2026: no morning run at all)
    - cron: '13 6 * * *'     # morning: today + error over 30 days
    - cron: '43 6 * * *'     # tomorrow's forecasts: from early morning on, so the price forecast shows well before the 13:00 auction
    - cron: '7,37 7-11 * * *'
    - cron: '41 16 * * *'
    - cron: '47 19 * * *'    # late publishers
  # GitHub's scheduler skips runs on busy days (26 Oct 2026: none at all from 22:56 to 14:00): the forecast also runs
  # after the frequent data jobs finish (events are not skipped), when it is due — see the "Due?" step
  workflow_run:
    workflows: ['Fetch Energy Data', 'Fetch Energy News', 'Alerts (e-mail)']
    types: [completed]
  workflow_dispatch:
    inputs:
      accuracy:
        description: 'Also refresh the 30-day error'
        type: boolean
        default: true

concurrency:
  group: fetch-forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # after another job: run only if the forecast is due (tomorrow missing from 7:00 Paris, or older than 3 h)
      - name: Due?
        id: due
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(ZoneInfo('Europe/Paris')); tm = (now.date() + dt.timedelta(days=1)).isoformat()
          try: j = json.load(open('data/neg_forecast.json'))
          except Exception: j = {}
          upd = j.get('updated'); age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(upd.replace('Z', '+00:00'))).total_seconds() / 3600 if upd else 99
          due = (now.hour >= 7 and tm not in (j.get('days') or {})) or age > 3
          print('run=' + ('yes' if due and 6 <= now.hour <= 22 else 'no'))
          PY
      - uses: actions/setup-python@v6
        if: steps.due.outputs.run == 'yes'
        with:
          python-version: '3.12'
      - name: Fetch
        if: steps.due.outputs.run == 'yes'
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}   # France load forecast for tomorrow before Energy-Charts serves it
        run: |
          if [ "${{ github.event.schedule }}" = "13 6 * * *" ] || [ "${{ inputs.accuracy }}" = "true" ]; then
            python scripts/fetch_forecast.py --accuracy
          else
            python scripts/fetch_forecast.py
          fi
      # our solar and wind first (tomorrow runs on weather alone until the TSO publishes, late afternoon), then the
      # price model on them, then our forecast again with the fresh chance of a negative price
      - name: PowerKlock combined solar and wind forecast (France)
        if: steps.due.outputs.run == 'yes'
        run: pip install -q numpy==2.5.4 && cd scripts && python fcst_live.py || echo "::warning::combined forecast failed"
      - name: Negative prices, today and tomorrow
        if: steps.due.outputs.run == 'yes'
        run: python scripts/neg_forecast.py || echo "::warning::negative-price forecast failed"
      - name: Combined forecast, second pass
        if: steps.due.outputs.run == 'yes'
        run: cd scripts && python fcst_live.py || echo "::warning::combined forecast failed"
      - name: Commit and push
        if: steps.due.outputs.run == 'yes'
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/forecast.json data/history/forecast data/neg_forecast.json data/fr_fc_combined.json
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "data: forecasts $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null || true
            sleep 8
          done
          exit 1
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
