name: Morning reel

# The morning reel (reel.html) recorded to a vertical MP4 at 08:00 Paris (scripts/record_reel.py), posted to
# Instagram for free through Meta's own Graph API (scripts/post_reel.py, META_* secrets — see
# scripts/refresh_meta_token.py for the token) and sent by e-mail as a backup (scripts/send_reel.py,
# GO_GMAIL_* secrets). The video is also kept 30 days as a run artifact.
#
# Nothing is committed to main or site: a git history that keeps every day's ~15 MB video forever would add
# gigabytes a year for files nobody looks at again. Instead, because Meta's publish API needs a public HTTPS
# URL (it cannot take the bytes directly), the reel-public branch is force-pushed each run with just the
# current videos (one file per reel kind, replaced, never appended) — the same pattern already used for the
# `site` branch in publish.yml — then read back from raw.githubusercontent.com.

on:
  schedule:
    - cron: '0 7 * * *'      # 08:00 Paris in winter
    - cron: '0 6 * * *'      # 08:00 Paris in summer (the step below keeps only the one that is 08:00 in Paris)
  workflow_dispatch:

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write   # to force-push the reel-public branch
    steps:
      - name: The slot of the current Paris time? (winter UTC+1 → 07:00 UTC, summer UTC+2 → 06:00 UTC; a late start still runs once)
        id: due
        run: |
          [ "$(TZ=Europe/Paris date +%z)" = "+0100" ] && WANT="0 7 * * *" || WANT="0 6 * * *"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "$WANT" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.due.outputs.run == 'true'
      - uses: actions/setup-python@v6
        if: steps.due.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install Chromium
        if: steps.due.outputs.run == 'true'
        run: |
          pip install playwright==1.48.0 imageio-ffmpeg requests==2.33.1
          python -m playwright install --with-deps chromium
      - name: Record
        if: steps.due.outputs.run == 'true'
        run: python scripts/record_reel.py --lang fr
      - uses: actions/upload-artifact@v6
        if: steps.due.outputs.run == 'true'
        with:
          name: reel
          path: out/reel/*.mp4
          retention-days: 30
      - name: Send by e-mail
        if: steps.due.outputs.run == 'true'
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          REEL_TO: ${{ secrets.REEL_TO }}
        run: python scripts/send_reel.py out/reel/*.mp4
      - name: Publish the video publicly (for the Instagram API)
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          rm -rf /tmp/reel-public && mkdir -p /tmp/reel-public
          for f in out/reel/*.mp4; do
            kind=$(basename "$f" | sed -E 's/^reel-[0-9-]+-([a-z]+)-[a-z]+\.mp4$/\1/')
            cp "$f" "/tmp/reel-public/$kind.mp4"
          done
          cd /tmp/reel-public
          git init -q -b reel-public
          git add -A
          git commit -q -m "reel $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git push -q -f origin reel-public && exit 0; sleep 5; done; exit 1
      - name: Post to Instagram
        if: steps.due.outputs.run == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python scripts/post_reel.py out/reel/*.mp4
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
