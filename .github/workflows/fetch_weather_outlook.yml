name: Fetch weather outlook (France, 5 weeks vs normal)

# Open-Meteo GFS ensemble (35 days) and ERA5 normals 2016–2025 → temperature,
# wind and solar production (calibrated on RTE), hydro-basin precipitation
# → data/weather_outlook.json (scripts/fetch_weather_outlook.py).
# The ERA5 archive cache (data/history/weather_archive.json) is refreshed weekly.

on:
  schedule:
    - cron: '30 7 * * *'     # GFS 00z ensemble is available by then
    # Open-Meteo's free daily quota is counted per IP, and GitHub runners share theirs: the morning run
    # often finds it spent. Catch-up slots on other runners, skipped when the outlook is under 18 h old.
    - cron: '13 10 * * *'
    - cron: '47 13 * * *'
    - cron: '19 18 * * *'
    - cron: '41 22 * * *'
  workflow_dispatch:

concurrency:
  group: fetch-weather-outlook
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch (unless the outlook is already fresh)
        run: |
          AGE=$(python3 -c "import json,datetime as d;j=json.load(open('data/weather_outlook.json'));u=j.get('updated');print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u.replace('Z','+00:00'))).total_seconds()/3600) if u else 999)" 2>/dev/null || echo 999)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$AGE" -lt 18 ]; then echo "outlook ${AGE} h old: nothing to do"; exit 0; fi
          python scripts/fetch_weather_outlook.py
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/weather_outlook.json data/history/weather_archive.json
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "data: weather outlook $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null
            sleep 8
          done
          exit 1
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
