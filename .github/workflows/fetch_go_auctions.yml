name: Fetch GO Auctions (EEX FR)

# Scrape l'enchère mensuelle EEX France (power GO) -> data/go_auctions.json
# Source publique, append-only (dédup par mois d'enchère). Self-healing :
# relancer ne fait que ré-écrire le mois courant s'il a changé.

on:
  schedule:
    - cron: "0 8 * * 1"        # tous les lundis 08h UTC (attrape le nouveau résultat ~J+2)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-go-auctions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests==2.33.1 pandas==3.1.0 lxml==6.1.3 openpyxl==3.1.5

      - name: Run scraper
        run: python scripts/fetch_go_auctions.py

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/go_auctions.json
          git diff --cached --quiet || git commit -m "auto: update go_auctions.json [$(date +%Y-%m-%d)]"
          # a data job may have pushed meanwhile: rebase on it, then push (5 tries)
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 8; done; exit 1

      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
