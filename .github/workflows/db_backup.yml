name: Database backup (nightly, encrypted)

# The accounts' data in Supabase (schema public: dashboards, alert rules, news sources and votes,
# market notes, team list) dumped every night, encrypted with BACKUP_PASSPHRASE (artifacts of a
# public repository can be downloaded by any GitHub user), kept 90 days as a workflow artifact.
# Without BACKUP_PASSPHRASE nothing is dumped.
# Restore: download the artifact, gpg -d db.dump.gpg > db.dump, pg_restore --no-owner -d <database> db.dump

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secrets present?
        id: ok
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}', PASS: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then echo "::notice::BACKUP_PASSPHRASE or SUPABASE_DB_URL missing: no backup"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: PostgreSQL 17 client (dumps any server up to 17)
        if: steps.ok.outputs.go == 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Dump and encrypt
        if: steps.ok.outputs.go == 'true'
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}', PASS: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --no-owner --no-privileges -Fc -f db.dump
          ls -la db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o db.dump.gpg db.dump
          rm db.dump
      - uses: actions/upload-artifact@v6
        if: steps.ok.outputs.go == 'true'
        with:
          name: db-backup-${{ github.run_id }}
          path: db.dump.gpg
          retention-days: 90
      # a failed backup must not go unnoticed: only the e-mail script is checked out (the dump never touches the repository)
      - uses: actions/checkout@v5
        if: failure()
        with: { sparse-checkout: scripts/notify_failure.py, sparse-checkout-cone-mode: false }
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
