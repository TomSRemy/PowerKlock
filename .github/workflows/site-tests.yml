name: Site tests

# Every code change: Python lint (ruff.toml), JavaScript syntax, the calculations (tests/test_calculations.py,
# tests/test_prices_dst.py), the site logic value by value (tests/test_site_logic.py), then every page,
# fullscreen button and dashboard widget in a browser, in English and in French (tests/smoke.py).
# Data-only commits from the fetch bots do not trigger it. The publish workflow runs the same tests before
# the site branch moves (.github/workflows/publish.yml).

on:
  pull_request:
  push:
    branches-ignore: ['backfill-run/**']
    paths:
      - 'index.html'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'ruff.toml'
      - '.github/workflows/site-tests.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0 requests==2.33.1
          python -m playwright install --with-deps chromium
      - name: Python lint
        run: pip install -q ruff==0.17.2 && ruff check scripts tests warehouse
      - name: JavaScript syntax
        run: for f in js/*.js js/*/*.js; do case "$f" in js/vendor/*) continue;; esac; node --check "$f" || exit 1; done
      - name: Calculations
        run: pip install -q numpy==2.2.6 scipy==1.15.3 && python tests/test_calculations.py && python tests/test_prices_dst.py && python tests/test_bess_optim.py
      - name: Site logic
        run: python tests/test_site_logic.py && python tests/test_ppa_frozen.py && python tests/test_consistency.py
      - name: Smoke tests (English and French)
        run: python tests/smoke.py

      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
