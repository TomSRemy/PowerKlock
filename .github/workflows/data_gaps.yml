name: Holes in the data

# Every two hours: what is missing inside the histories (scripts/check_data_gaps.py →
# data/data_gaps.json, shown on General › Data status), each hole followed from the first
# time it is seen until it is filled.

on:
  schedule:
    - cron: '41 */2 * * *'
  push:
    branches: [main]
    paths: ['scripts/check_data_gaps.py', 'scripts/verify_prices.py', 'scripts/verify_markets.py', '.github/workflows/data_gaps.yml']
  workflow_dispatch:

concurrency:
  group: data-gaps
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Second source for the prices (once a day)
        continue-on-error: true
        run: |
          AGE=$(python3 -c "import json,datetime as d;u=json.load(open('data/history/price_check.json'))['updated'];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u)).total_seconds()/3600))" 2>/dev/null || echo 999)
          if [ "${{ github.event_name }}" = "push" ]; then python scripts/verify_prices.py --since 2020-01-01      # a change to the check: the whole history again
          elif [ "$AGE" -ge 20 ]; then python scripts/verify_prices.py --days 60; else echo "checked ${AGE} h ago"; fi
      - name: Second sources for France production, Brent, EUR/USD (once a day)
        continue-on-error: true
        run: |
          AGE=$(python3 -c "import json,datetime as d;u=json.load(open('data/history/market_check.json'))['updated'];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u)).total_seconds()/3600))" 2>/dev/null || echo 999)
          if [ "${{ github.event_name }}" = "push" ] || [ "$AGE" -ge 20 ]; then python scripts/verify_markets.py --days 45; else echo "checked ${AGE} h ago"; fi
      - name: Holes check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          [ -n "$R2_BUCKET" ] && pip install -q boto3==1.43.118 || true
          python scripts/check_data_gaps.py
      - name: Storage alert by e-mail (at most once a day)
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
        run: |
          MSG=$(python3 -c "import json;d=json.load(open('data/data_gaps.json'));print(' / '.join(i['what'] for i in d['open'] if i['dataset']=='storage'))")
          if [ -n "$MSG" ] && [ "$(date -u +%H)" = "08" ]; then
            SUBJECT="PowerKlock · stockage : bientôt la limite" BODY="$MSG. Détail sur la page Data status du site. — PowerKlock" python3 scripts/notify_failure.py || true
          fi
      - name: Keep a newer comparison made while this job ran
        run: |
          # The full comparison can take more than an hour. If a price repair (which checks its zones again) or
          # another check landed meanwhile, this job's result is older: the newer one is kept, never overwritten.
          git fetch -q origin main
          for f in data/history/price_check.json data/history/market_check.json; do
            if ! git diff --quiet ${{ github.sha }} origin/main -- "$f" data/history/repair_log.json; then
              echo "::notice::$f changed upstream while this job ran: upstream version kept"; git checkout origin/main -- "$f" data/history/repair_log.json
            fi
          done
          python scripts/check_data_gaps.py
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"; git config user.email "bot@powerdesk.local"
          git add data/data_gaps.json data/history/price_check.json data/history/market_check.json 2>/dev/null; git add data/data_gaps.json
          git diff --staged --quiet && exit 0
          git commit -q -m "data: holes check $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
