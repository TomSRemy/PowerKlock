name: Fetch Great Britain (NESO, Elexon)

# Great Britain hour by hour: generation by type (NESO open data) and the day-ahead market index price (Elexon),
# for the merit order of the PPA scenario generator (no key needed).
# Writes data/history/gb_hourly/YYYY.json (scripts/fetch_gb.py).

on:
  schedule:
    - cron: "23 6 * * 1"       # every Monday
  workflow_dispatch:
    inputs:
      since:
        description: 'backfill from this year (YYYY); empty = this year and last'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch-gb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests

      - name: Fetch
        env:
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then python scripts/fetch_gb.py --since "$SINCE"; else python scripts/fetch_gb.py; fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/gb_hourly
          git diff --cached --quiet || git commit -m "data: Great Britain generation and prices $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 8; done; exit 1

      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
