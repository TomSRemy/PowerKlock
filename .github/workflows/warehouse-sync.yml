name: Warehouse sync (Supabase)

# Mirrors the data files into the PowerKlock PostgreSQL warehouse
# (warehouse/README.md). Runs after each data fetch, every 6 hours as a
# safety net, or by hand (tick "full" to reload everything).
# Right after the sync, scripts/build_drivers.py reads the warehouse and the data
# files (they win, so a day the warehouse lacks still counts) and rebuilds
# data/drivers/frames.json (Markets › What drives the price, and its block on
# Today); the file is pushed only when a figure changed. The data fetch runs
# about 30 times a day (11:17 and 12:47 UTC for the day-ahead auction) and the RTE
# job three times: the latest days are shown as provisional frames in between.
#
# Needs the repository secret SUPABASE_DB_URL: Supabase → Connect →
# Session pooler connection string (IPv4; the "Direct" one is IPv6-only and
# unreachable from GitHub runners). Without it the job skips cleanly.

on:
  workflow_run:
    workflows:
      - Fetch Energy Data
      - Fetch RTE (éCO2mix France, M0 reference prices)
      - Fetch FR Market Data (Energy Market Price)
      - Fetch GO Prices (Commerg)
      - Fetch GO Auctions (EEX FR)
      - Fetch Energy-Charts (capacity, cross-border flows)
      - Backfill Historical Data
      - Backfill chain v3 (monthly, parallel)
      - Backfill generation (after prices)
    types: [completed]
  # a push to main that changes the forward contracts or the warehouse code syncs at once
  push:
    branches: [main]
    paths:
      - 'data/history/fr_market_contracts.json'
      - 'warehouse/**'
      - 'scripts/build_drivers.py'
      - '.github/workflows/warehouse-sync.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Reload every file (otherwise only files changed since the last sync)'
        type: boolean
        default: false

concurrency:
  group: warehouse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # to push data/drivers/frames.json
    steps:
      - name: Check secret
        id: secret
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::notice::SUPABASE_DB_URL is not set — warehouse sync skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.secret.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        if: steps.secret.outputs.ok == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.secret.outputs.ok == 'true'
        run: pip install "psycopg[binary]==3.3.2" numpy==2.2.6

      - name: Sync
        if: steps.secret.outputs.ok == 'true'
        env:
          WAREHOUSE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python warehouse/sync.py ${{ inputs.full && '--full' || '' }}

      - name: What drives the price (weekly frames from the warehouse just synced and the data files)
        if: steps.secret.outputs.ok == 'true'
        env:
          WAREHOUSE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/build_drivers.py

      - name: Commit and push the frames
        if: steps.secret.outputs.ok == 'true'
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/drivers/frames.json
          if git diff --staged --quiet; then
            echo "No change in data/drivers/frames.json — skipping commit."
            exit 0
          fi
          git commit -m "data: what drives the price $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Other bots push to main at the same time: on a conflict keep this
          # run's fresh file (-X theirs = the commit being replayed).
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."
            sleep $((5 + RANDOM % 20))
          done
          echo "Failed to push after 8 attempts."
          exit 1

      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
