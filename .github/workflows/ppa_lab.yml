name: PPA pricer test bench (weekly)

# Neighbours' hourly data (Energy-Charts), then the test bench of the PPA pricer:
# six approaches replayed month by month (calibration 2019-2023, verdict 2024 →),
# the ensemble and its band, and monthly capture forecasts for the short-term tab
# (scripts/ppa_lab.py → data/history/ppa_lab.json, ppa_forecast.json).

on:
  schedule:
    - cron: '20 4 * * 0'      # Sunday 04:20 UTC
  workflow_dispatch:

concurrency:
  group: ppa-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests==2.33.1 numpy==2.5.4 scipy==1.18.1   # scipy: the analogues of the generator's full Monte Carlo (cKDTree)
      - name: Neighbours, recent years
        run: python scripts/fetch_region_hourly.py --recent
      - name: Detailed replay of the current methods
        run: python scripts/ppa_backtest_detail.py --sims 40
      - name: Regional capture (France, 12 regions)
        run: python scripts/fetch_fr_regions_capture.py --recent || echo "::warning::regional capture not updated"
      - name: Keep last week's forecast file (to restore the generator if it fails)
        run: cp data/history/ppa_forecast.json /tmp/ppa_forecast_prev.json
      - name: Test bench and forecasts
        run: python scripts/ppa_lab.py --sims 300
      - name: Integrated method (realised last year × the European model's change)
        run: python scripts/ppa_integrated.py || echo "::warning::integrated method not updated"
      - name: Model risk of the scenario generator (its past errors, deliveries since 2023, complete months)
        run: python scripts/ppa_model_risk.py || echo "::warning::model risk not updated"
      - name: PPA price at other stop thresholds, replayed (the pricer's threshold rule against the realised)
        run: python scripts/ppa_threshold_test.py || echo "::warning::threshold replay not updated"
      - name: Journal officiel watch (new texts on the stop obligations at negative prices)
        run: python scripts/watch_jorf_flex.py || echo "::warning::Journal officiel not read"
      - name: RTE's Bilan électrique (figures only RTE publishes, read once a year) and weather-corrected consumption (ODRÉ)
        run: pip install -q pypdf==6.21.2 && python scripts/fetch_rte_bilan.py || echo "::warning::RTE Bilan not read"
      - name: Who keeps producing at negative prices (register, stop obligations, measured behaviour)
        run: python scripts/build_flex_share.py || echo "::warning::flex share not updated"
      - name: Scenario generator (sets the published price, solar and wind)
        # a failure is retried once; a second failure puts back last week's results (scripts/ppa_generator_restore.py)
        # instead of leaving the site on the old method, and e-mails (step below)
        run: |
          python scripts/ppa_generator.py && exit 0
          echo "::warning::scenario generator failed, retrying once"
          python scripts/ppa_generator.py && exit 0
          echo "::error::scenario generator failed twice: last week's results put back"
          python scripts/ppa_generator_restore.py /tmp/ppa_forecast_prev.json || true
          echo "GEN_FAILED=1" >> "$GITHUB_ENV"
      - name: Walk-forward test, year by year
        run: python scripts/ppa_walkforward.py || echo "::warning::walk-forward not updated"
      - name: Capture fan
        run: python scripts/build_ppa_fan.py
      - name: Test of the bias corrections (complete delivery years; decides which ones are taken)
        run: python scripts/ppa_bias_test.py || echo "::warning::bias test not updated"
      - name: Each method's past bias (the pricer takes it off where it helps)
        run: python scripts/ppa_bias.py --cache || echo "::warning::methods' bias not updated"
      - name: Weights of the methods in the published price (inverse of their past error; solar)
        run: python scripts/ppa_weights.py || echo "::warning::method weights not updated"
      - name: Production forecast backtest
        run: python scripts/fcst_backtest.py || echo "::warning::forecast backtest not updated"
      - name: Production forecast vs ENTSO-E, France
        run: cd scripts && python fcst_national.py || echo "::warning::national forecast comparison not updated"
      - name: National production model (Monte Carlo weather method)
        run: python scripts/prod_model.py || echo "::warning::production model not updated"
      - name: Why the capture forecasts miss (factors)
        run: python scripts/ppa_factors.py || echo "::warning::factors not updated"
      - name: Neighbours' TSO forecasts vs ours
        run: cd scripts && python fcst_neighbours.py || echo "::warning::neighbours comparison not updated"
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/history/region_hourly data/history/ppa_backtest_detail.json data/history/ppa_lab.json data/history/ppa_forecast.json data/history/ppa_walkforward.json data/history/fr_regional_capture.json data/history/ppa_fan.json data/history/fcst_backtest.json data/history/fcst_calib.json data/history/fcst_national.json data/history/fcst_national_hourly.json data/history/fr_prod_model.json data/history/ppa_factors.json data/history/fcst_neighbours.json data/history/ppa_bias.json data/history/ppa_bias_test.json data/history/ppa_weights.json data/history/ppa_model_risk.json data/history/flex_share.json data/history/ppa_threshold_test.json data/history/flex_watch.json data/history/rte_curtailment.json data/history/rte_bilan_figures.json
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -m "data: PPA test bench $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
          exit 1

      - name: E-mail when the Journal officiel has a new text on the stop obligations
        if: env.JORF_NEW != ''
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUBJECT: "PowerKlock · nouveau texte au Journal officiel sur l'arrêt aux prix négatifs"
          BODY: "La veille du Journal officiel a repéré ${{ env.JORF_NEW }} nouveau(x) texte(s) sur l'arrêt aux prix négatifs (obligation d'achat, complément de rémunération, article 175 de la loi de finances 2025). Ils sont listés « à examiner » sous Prix › Prix négatifs › France · qui produit encore sous 0 €, et dans data/history/flex_watch.json. À reporter dans config/flex_rules.json avec la date vérifiée."
        run: python3 scripts/notify_failure.py || true

      - name: E-mail when RTE's Bilan électrique could not be read as before
        if: env.RTE_BILAN_MISSING != ''
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUBJECT: "PowerKlock · Bilan électrique de RTE : un chiffre n'a pas été lu"
          BODY: "Le job annuel du Bilan électrique de RTE n'a pas retrouvé certains chiffres (RTE a sans doute changé une formulation) : ${{ env.RTE_BILAN_MISSING }}. Rien n'a été deviné : la case reste vide sur Système électrique › Bilan électrique. Une formulation est à ajouter dans scripts/fetch_rte_bilan.py."
        run: python3 scripts/notify_failure.py || true

      - name: E-mail when the scenario generator failed
        if: env.GEN_FAILED == '1'
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUBJECT: "PowerKlock · le générateur de scénarios a échoué (résultats de la semaine précédente remis)"
          BODY: "Le générateur de scénarios (prix PPA publié) a échoué deux fois dans le job hebdomadaire. Les résultats de la semaine précédente ont été remis en place : le prix publié reste celui du générateur, mais il n'est pas à jour. Le pricer l'indique par un bandeau. Détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python3 scripts/notify_failure.py || true

      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
