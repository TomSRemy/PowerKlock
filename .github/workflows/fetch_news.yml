name: Fetch Energy News

# Public RSS/Atom feeds → data/news.json (scripts/fetch_news.py).
# Server-side so the site needs no CORS proxy.

on:
  schedule:
    - cron: '15 */3 * * *'   # every 3 hours
  workflow_dispatch:

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests==2.33.1
      - name: Fetch news feeds
        run: python scripts/fetch_news.py
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No news changes — skipping commit."
            exit 0
          fi
          git commit -m "data: update news $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Failed to push after 5 attempts."
          exit 1
