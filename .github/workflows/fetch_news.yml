name: Fetch Energy News

# Public RSS/Atom feeds, the CRE news page and press searches (GDELT)
# listed in config/news_sources.json → data/news.json (scripts/fetch_news.py).
# Server-side so the site needs no CORS proxy.

on:
  schedule:
    - cron: '15 * * * *'     # every hour (sources added from the site are read at the next run)
  push:                      # a source added in config/news_sources.json is read right away
    branches: [main]
    paths: ['config/news_sources.json']
  workflow_dispatch:

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests==2.33.1 "psycopg[binary]==3.3.2"
      - name: Fetch news feeds
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}   # optional: sources added from the site
        run: python scripts/fetch_news.py
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/news.json data/news_prefs.json 2>/dev/null || git add data/news.json
          if git diff --staged --quiet; then
            echo "No news changes — skipping commit."
            exit 0
          fi
          git commit -m "data: update news $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            # -X theirs: on a conflict in news.json, the file just fetched (this run's commit) wins
            git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Failed to push after 5 attempts."
          exit 1

      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
