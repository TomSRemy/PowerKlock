name: Fetch FR Market Data (SEFE)

# Fetch France power forward curve, spot, nuclear capacity, generation mix,
# the daily market-insights narrative, and gas/carbon/coal/oil series
# (data/commodities.json) from SEFE Energy's public "daily" cockpit
# (cockpit.energymarketprice.com). No credentials needed — publicly authorized link.

on:
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC = 08:30 CET — after the SEFE daily report refreshes
  workflow_dispatch:

concurrency:
  group: fetch-fr-market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests==2.33.1
      - name: Fetch FR market data
        run: python scripts/fetch_fr_market.py
      - name: Monthly forward over the quoted horizon
        run: python scripts/build_forward_monthly.py || echo "::warning::monthly forward not rebuilt"
      - name: Fetch gas / carbon / coal / oil + FR nuclear availability
        # Same SEFE public cockpit; failure must not block the FR market commit.
        continue-on-error: true
        run: PYTHONPATH=scripts python scripts/fetch_commodities.py
      - name: Commit and push data files
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/fr_market.json data/history/fr_market/ data/history/fr_market_series.json data/history/fr_market_calchain.json data/history/fr_market_contracts.json data/history/fr_market_rolling.json data/history/fr_forward_monthly.json data/commodities.json data/history/commodities_series.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "data: update FR market (SEFE) $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Other bots push to main at the same time: on a conflict keep this
          # run's fresh files (-X theirs = the commit being replayed).
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."
            sleep $((5 + RANDOM % 20))
          done
          echo "Failed to push after 8 attempts."
          exit 1
