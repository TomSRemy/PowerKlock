name: Fetch FR Market Data (SEFE)

# Fetch France power forward curve, spot, nuclear capacity, generation mix,
# the daily market-insights narrative, and gas/carbon/coal/oil series
# (data/commodities.json) from SEFE Energy's public "daily" cockpit
# (cockpit.energymarketprice.com). No credentials needed — publicly authorized link.

on:
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC = 08:30 CET — after the SEFE daily report refreshes
    # then again through the day: SEFE corrects and completes its cockpit after the morning, and GitHub often starts
    # the morning run hours late (11:54 UTC on 23 Oct, not at all before 10:37 on 27 Oct). Each run commits only a change.
    - cron: '7 7 * * *'
    - cron: '43 8 * * *'
    - cron: '30 9 * * *'     # 10:30 Paris (winter): the cockpit usually refreshes around 10:56 Paris
    - cron: '0 10 * * *'     # 11:00 Paris
    - cron: '19 10 * * *'
    - cron: '53 12 * * *'
    - cron: '37 15 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:

concurrency:
  group: fetch-fr-market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Fetched less than 20 minutes ago? (a late run catching up with the next slot)
        id: due
        run: |
          AGE=$(python3 -c "import json,datetime as d;t=json.load(open('data/fr_market.json')).get('lastUpdate');print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t)).total_seconds()//60) if t else 9999)" 2>/dev/null || echo 9999)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$AGE" -lt 20 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "fetched $AGE min ago"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.due.outputs.run == 'true'
        run: pip install requests==2.33.1
      - name: Fetch FR market data
        if: steps.due.outputs.run == 'true'
        run: python scripts/fetch_fr_market.py
      - name: Monthly forward over the quoted horizon
        if: steps.due.outputs.run == 'true'
        run: python scripts/build_forward_monthly.py || echo "::warning::monthly forward not rebuilt"
      - name: Fetch gas / carbon / coal / oil + FR nuclear availability
        if: steps.due.outputs.run == 'true'
        # Same SEFE public cockpit; failure must not block the FR market commit.
        continue-on-error: true
        run: PYTHONPATH=scripts python scripts/fetch_commodities.py
      - name: Commit and push data files
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add data/fr_market.json data/history/fr_market/ data/history/fr_market_series.json data/history/fr_market_calchain.json data/history/fr_market_contracts.json data/history/fr_market_contracts_*.json data/history/fr_market_rolling.json data/history/fr_forward_monthly.json data/commodities.json data/history/commodities_series.json data/history/ttf_contracts.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "data: update FR market (SEFE) $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Other bots push to main at the same time: on a conflict keep this
          # run's fresh files (-X theirs = the commit being replayed).
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."
            sleep $((5 + RANDOM % 20))
          done
          echo "Failed to push after 8 attempts."
          exit 1
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
