name: Probe news sources (temporary)
# Temporary: what robots.txt says for each feed the collection reads, and Aurora's sitemap. Removed after reading.
on:
  push:
    branches: [claude/brave-dijkstra-0b04zg]
    paths: ['.github/workflows/probe_sources.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          cat > /tmp/p.py <<'PY'
          import json, urllib.request, urllib.robotparser
          from urllib.parse import urlparse
          UA = "Mozilla/5.0 (PowerKlock news fetcher; +https://github.com/TomSRemy/PowerKlock)"
          cfg = json.load(open("config/news_sources.json"))
          urls = [(f["name"], f["url"]) for f in cfg["feeds"]] + [("ACER", "https://www.acer.europa.eu/rss.xml"), ("reNEWS", "https://renews.biz/feed/"), ("Echo du solaire", "https://www.lechodusolaire.fr/feed/")]
          for name, u in urls:
              host = urlparse(u).scheme + "://" + urlparse(u).netloc
              try:
                  txt = urllib.request.urlopen(urllib.request.Request(host + "/robots.txt", headers={"User-Agent": UA}), timeout=15).read().decode("utf-8", "ignore")
              except Exception as e:
                  print(f"{name:26s} robots unreadable ({str(e)[:40]}) -> allowed  {u}"); continue
              rp = urllib.robotparser.RobotFileParser(); rp.parse(txt.splitlines())
              ok = rp.can_fetch(UA, u)
              print(f"{name:26s} {'ok        ' if ok else 'DISALLOWED'} {u}")
              if not ok:
                  grp, out = None, []
                  for line in txt.splitlines():
                      l = line.strip()
                      if l.lower().startswith("user-agent"): grp = l
                      elif l.lower().startswith("disallow") and grp and ("*" in grp):
                          out.append(l)
                  print("      group * :", out[:12])
          for u in ["https://auroraer.com/robots.txt", "https://auroraer.com/sitemap.xml", "https://auroraer.com/insight-sitemap.xml", "https://auroraer.com/post-sitemap.xml"]:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=15).read().decode("utf-8", "ignore")
                  print("==", u, len(b)); print(b[:900])
              except Exception as e:
                  print("==", u, "ERR", str(e)[:60])
          PY
          python3 /tmp/p.py
