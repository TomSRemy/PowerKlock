name: Probe news sources (temporary)
# Temporary: robots.txt read as the standard says (RFC 9309: an unreadable file allows), feed status, Aurora. Removed after reading.
on:
  push:
    branches: [claude/brave-dijkstra-0b04zg]
    paths: ['.github/workflows/probe_sources.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          cat > /tmp/p.py <<'PY'
          import re, urllib.request, urllib.robotparser, urllib.error
          from urllib.parse import urlparse
          UA = "Mozilla/5.0 (PowerKlock news fetcher; +https://github.com/TomSRemy/PowerKlock)"
          C = {"Cornwall Insight": "https://www.cornwall-insight.com/feed/", "Ember": "https://ember-energy.org/feed/", "IEA": "https://www.iea.org/rss/news.xml",
               "Renewables Now": "https://renewablesnow.com/news/rss/", "Current+-": "https://www.current-news.co.uk/feed/", "Solar Power Portal": "https://www.solarpowerportal.co.uk/feed",
               "Energy Live News": "https://www.energylivenews.com/feed/", "L'EnerGeek": "https://lenergeek.com/feed/", "Techniques de l'ingenieur": "https://www.techniques-ingenieur.fr/actualite/feed/",
               "Usine Nouvelle": "https://www.usinenouvelle.com/rss/", "Actu-Environnement": "https://www.actu-environnement.com/flux/rss/energie/", "La Tribune": "https://www.latribune.fr/feed.xml",
               "LCP Delta": "https://www.lcp.com/en/feed", "Euractiv": "https://www.euractiv.com/sections/energy-environment/feed/", "Les Echos": "https://services.lesechos.fr/rss/les-echos-energie-environnement.xml",
               "Aurora sitemap": "https://auroraer.com/sitemap.xml", "Aurora insights": "https://auroraer.com/insights/"}
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20); return r.status, r.read(2_000_000).decode("utf-8", "ignore")
              except urllib.error.HTTPError as e: return e.code, ""
              except Exception as e: return str(e)[:30], ""
          for name, u in C.items():
              host = urlparse(u).scheme + "://" + urlparse(u).netloc
              st, txt = get(host + "/robots.txt")
              if st == 200:
                  rp = urllib.robotparser.RobotFileParser(); rp.parse(txt.splitlines()); rob = "allowed" if rp.can_fetch(UA, u) else "DISALLOWED"
              else:
                  rob = f"allowed (robots.txt {st})" if isinstance(st, int) and 400 <= st < 500 else f"? ({st})"
              fs, b = get(u)
              n = len(re.findall(r"<item[ >]|<entry[ >]|<loc>", b))
              print(f"{name:26s} robots: {rob:28s} feed: {fs} items/locs={n}")
              if rob == "DISALLOWED":
                  g, out = None, []
                  for l in txt.splitlines():
                      l = l.strip()
                      if l.lower().startswith("user-agent"): g = l
                      elif l.lower().startswith(("disallow", "allow")) and g and "*" in g: out.append(l)
                  print("     *:", out[:10])
              if name.startswith("Aurora") and b:
                  print("     ", re.findall(r"<loc>([^<]+)</loc>", b)[:12], re.findall(r'href="(/insights?/[^"]+)"', b)[:12])
          PY
          python3 /tmp/p.py
