name: Probe news sources (temporary)
# Temporary: feeds and robots.txt of outlets cited by Watts Else. Removed after reading.
on:
  push:
    branches: [claude/brave-dijkstra-0b04zg]
    paths: ['.github/workflows/probe_sources.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          cat > /tmp/p.py <<'PY'
          import re, urllib.request, urllib.robotparser, urllib.error
          from urllib.parse import urlparse
          UA = "Mozilla/5.0 (PowerKlock news fetcher; +https://github.com/TomSRemy/PowerKlock)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20); return r.status, r.read(2_000_000).decode("utf-8", "ignore")
              except urllib.error.HTTPError as e: return e.code, ""
              except Exception as e: return str(e)[:40], ""
          for u in ["https://www.energiesdelamer.eu/feed/", "https://www.gazdaujourdhui.fr/feed/", "https://www.enviscope.com/feed/", "https://www.sfen.org/feed/", "https://www.banquedesterritoires.fr/rss.xml", "https://www.batiactu.com/rss/index.php"]:
              h = "{0.scheme}://{0.netloc}".format(urlparse(u)); st, t = get(h + "/robots.txt")
              if st == 200: rp = urllib.robotparser.RobotFileParser(); rp.parse(t.splitlines()); ok = rp.can_fetch(UA, u)
              else: ok = f"robots {st} -> allowed" if isinstance(st, int) and 400 <= st < 500 else f"? {st}"
              fs, b = get(u)
              print(f"{u:52s} robots={ok} feed={fs} items={len(re.findall(r'<item[ >]|<entry[ >]', b))} latest={re.findall(r'<pubDate>([^<]+)', b)[:1]}")
          PY
          python3 /tmp/p.py
