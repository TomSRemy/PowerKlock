name: Probe news sources (temporary)
# Temporary: which candidate outlets publish a feed or a sitemap, how fresh, and what robots.txt says. Removed after reading.
on:
  push:
    branches: [claude/brave-dijkstra-0b04zg]
    paths: ['.github/workflows/probe_sources.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          cat > /tmp/p.py <<'PY'
          import re, urllib.request, urllib.robotparser
          from urllib.parse import urlparse
          UA = "Mozilla/5.0 (PowerKlock news fetcher; +https://github.com/TomSRemy/PowerKlock)"
          C = {
            "Aurora": ["https://auroraer.com/feed/", "https://auroraer.com/insights/feed/", "https://auroraer.com/sitemap_index.xml", "https://auroraer.com/insights/"],
            "Cornwall Insight": ["https://www.cornwall-insight.com/feed/"],
            "Energy Brainpool": ["https://blog.energybrainpool.com/en/feed/"],
            "Agora Energiewende": ["https://www.agora-energiewende.org/rss.xml", "https://www.agora-energiewende.org/en/rss"],
            "Ember": ["https://ember-energy.org/feed/", "https://ember-energy.org/latest-insights/feed/"],
            "Rystad": ["https://www.rystadenergy.com/rss", "https://www.rystadenergy.com/sitemap.xml"],
            "EnAppSys": ["https://www.enappsys.com/feed/"],
            "LCP Delta": ["https://www.lcp.com/en/feed"],
            "ACER": ["https://www.acer.europa.eu/rss.xml", "https://www.acer.europa.eu/news-and-events/news/rss.xml"],
            "IEA": ["https://www.iea.org/api/rss/news", "https://www.iea.org/rss/news.xml"],
            "Euractiv energy": ["https://www.euractiv.com/sections/energy-environment/feed/", "https://www.euractiv.com/section/energy/feed/"],
            "Renewables Now": ["https://renewablesnow.com/news/rss/", "https://renewablesnow.com/rss/"],
            "reNEWS": ["https://renews.biz/rss/", "https://renews.biz/feed/"],
            "Recharge": ["https://www.rechargenews.com/rss"],
            "Current+-": ["https://www.current-news.co.uk/feed/"],
            "Solar Power Portal": ["https://www.solarpowerportal.co.uk/feed"],
            "Energy Live News": ["https://www.energylivenews.com/feed/"],
            "L'Echo du solaire": ["https://www.lechodusolaire.fr/feed/"],
            "L'EnerGeek": ["https://lenergeek.com/feed/"],
            "Techniques de l'ingenieur": ["https://www.techniques-ingenieur.fr/actualite/energies-thematique_6/feed/", "https://www.techniques-ingenieur.fr/actualite/feed/"],
            "Usine Nouvelle energie": ["https://www.usinenouvelle.com/rss/energie/", "https://www.usinenouvelle.com/rss/"],
            "Actu-Environnement energie": ["https://www.actu-environnement.com/flux/rss/energie/"],
            "Le Journal de l'eolien": ["https://www.journal-eolien.org/feed/"],
            "Les Echos energie": ["https://services.lesechos.fr/rss/les-echos-energie-environnement.xml"],
            "La Tribune energie": ["https://www.latribune.fr/feed.xml", "https://www.latribune.fr/rss/rubriques/entreprises-finance/industrie/energie-environnement.html"],
            "Contexte": ["https://www.contexte.com/feed/"],
            "Energy-Storage.news (have)": ["https://www.energy-storage.news/feed/"],
          }
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20)
              return r.status, r.headers.get("content-type", ""), r.read(3_000_000).decode("utf-8", "ignore")
          for name, urls in C.items():
              host = urlparse(urls[0]).scheme + "://" + urlparse(urls[0]).netloc
              rp = urllib.robotparser.RobotFileParser(host + "/robots.txt")
              try: rp.read(); rob = "ok" if all(rp.can_fetch(UA, u) for u in urls) else "DISALLOWED"
              except Exception as e: rob = "robots?"
              for u in urls:
                  try:
                      st, ct, b = get(u)
                      items = len(re.findall(r"<item[ >]|<entry[ >]", b)); locs = len(re.findall(r"<loc>", b))
                      dates = re.findall(r"<pubDate>([^<]+)</pubDate>|<updated>([^<]+)</updated>|<lastmod>([^<]+)</lastmod>", b)[:2]
                      t = re.findall(r"<item[^>]*>.*?<title>(?:<!\[CDATA\[)?([^<\]]+)", b, re.S)[:3]
                      print(f"{name:28s} {st} {ct[:22]:22s} items={items:3d} locs={locs:4d} robots={rob} {u}")
                      if dates: print("      latest:", [x for d in dates for x in d if x][:2])
                      for x in t: print("      -", x.strip()[:100])
                  except Exception as e:
                      print(f"{name:28s} ERR {str(e)[:60]:60s} robots={rob} {u}")
          PY
          python3 /tmp/p.py
