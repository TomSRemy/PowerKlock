name: Fetch GO Prices (Commerg)

# Lit les mails Commerg via IMAP (mot de passe d'application Gmail, pas OAuth)
# et met à jour data/go_prices.csv.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   GO_GMAIL_USER          — l'adresse Gmail qui reçoit les mails Commerg
#   GO_GMAIL_APP_PASSWORD  — mot de passe d'application (16 caractères),
#                             généré sur https://myaccount.google.com/apppasswords
#                             (nécessite la validation en 2 étapes activée sur
#                             le compte). N'expire pas tant qu'il n'est pas
#                             révoqué — pas de refresh token à gérer.

on:
  schedule:
    - cron: "0 14 * * 5"      # chaque vendredi 14h UTC (Commerg envoie le vendredi)
  workflow_dispatch:           # déclenchement manuel possible

permissions:
  contents: write              # autorise le commit de data/go_prices.csv

jobs:
  fetch-go-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run parser
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
        run: python scripts/fetch_go_prices.py

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/go_prices.csv
          git diff --cached --quiet || git commit -m "auto: update go_prices.csv [$(date +%Y-%m-%d)]"
          git push
