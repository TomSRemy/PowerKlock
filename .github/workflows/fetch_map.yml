name: Fetch Power Map (generation per country, flows)

# Hourly generation per ENTSO-E production type, load and net import for
# about 30 European countries (Energy-Charts public_power, CC BY 4.0) and
# today's physical cross-border flows → data/map/YYYY-MM-DD.json and
# data/history/flows/ (scripts/fetch_energy_charts.py --map). Ten days kept.

on:
  schedule:
    - cron: '25 1-22/3 * * *'   # every 3 hours
  workflow_dispatch:

concurrency:
  group: fetch-energy-charts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch
        run: python scripts/fetch_energy_charts.py --map
      - name: Commit and push
        run: |
          git config user.name "PowerDesk Bot"
          git config user.email "bot@powerdesk.local"
          git add -A data/map data/history/flows
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "data: power map $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null
            sleep 8
          done
          exit 1
      - name: E-mail on failure
        if: failure()
        env:
          GO_GMAIL_USER: ${{ secrets.GO_GMAIL_USER }}
          GO_GMAIL_APP_PASSWORD: ${{ secrets.GO_GMAIL_APP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_failure.py || true
